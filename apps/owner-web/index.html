<!doctype html>
<html lang="en">
  <head>
    <!-- Boot-failure fallback (Ford, 2026-07-24) — replaces the 07-23 bounce that
         sent every browser back to the desktop SPA. If the SPA has painted
         nothing into #root a few seconds in (bad bundle, boot crash), fall back
         to the desktop site instead of stranding the owner on a white screen. A
         healthy boot paints immediately and this never fires. ?desktop=1 stops
         the desktop page bouncing straight back, so there is no redirect loop.
         Keep in sync with public/m/index.html after vite builds. -->
    <script>
    (function () {
      try {
        if (window.Capacitor) return;   // native shell: no desktop site to fall back to
        var done = false;
        function bail(why) {
          if (done) return;
          done = true;
          try { sessionStorage.setItem("ao_m_boot_fail", why || "1"); } catch (e) {}
          location.replace("/?desktop=1");
        }
        // Primary signal: the app bundle itself failing to load (404 after a bad
        // deploy, dropped connection). Capture phase, because resource errors do
        // not bubble. This is the real "/m is broken" case and it bails at once.
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (!t || t === window) return;
          var src = t.src || t.href || "";
          if ((t.tagName === "SCRIPT" || t.tagName === "LINK") && /\/m\/assets\//.test(src)) {
            bail("asset-error");
          }
        }, true);

        // Backstop only, deliberately generous. A blocked/slow webfont stylesheet
        // defers the module script, so #root can still be empty several seconds
        // in on a bad connection while the app is perfectly healthy — bailing at
        // ~8s would strand those owners on desktop for no reason. Armed at parse
        // time, not on DOMContentLoaded: a failed module leaves the document at
        // readyState "interactive" and DCL never fires.
        setTimeout(function () {
          var r = document.getElementById("root");
          if (!r || r.childElementCount === 0) bail("empty-root");
        }, 20000);
      } catch (e) {}
    })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#56B4F0" />
    <meta
      name="description"
      content="Array Operator — phone sky fleet, offtakers, and Energy Agent."
    />
    <title>Array Operator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
