<!doctype html>
<html lang="en">
  <head>
    <!-- Bounce browser windows off broken /m → desktop SPA (2026-07-23).
         Capacitor native shells keep /m. QA: /m/?mobile=1 or ao_force_mobile.
         Keep in sync with public/m/index.html after vite builds. -->
    <script>
    (function () {
      try {
        if (window.Capacitor) return;
        var qs = location.search || "";
        if (/[?&]mobile=1(?:&|$)/.test(qs)) {
          try { localStorage.setItem("ao_force_mobile", "1"); } catch (e) {}
          return;
        }
        try {
          if (localStorage.getItem("ao_force_mobile") === "1") return;
        } catch (e) {}
        location.replace("/" + qs + (location.hash || ""));
      } catch (e) {}
    })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#56B4F0" />
    <meta
      name="description"
      content="Array Operator — phone sky fleet, offtakers, and Energy Agent."
    />
    <title>Array Operator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
