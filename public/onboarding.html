<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up your array · Array Operator</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  /* Design language matched to array-operator-ea.netlify.app (styles.css):
     sun-mirror DARK palette — #0a0e14 radial bg, #3fd68a green accent,
     glassy gradient cards, glowing green buttons, plain-English voice. */
  :root{
    --bg:#0a0e14; --bg2:#0e131c; --ink:#eaf0f7; --muted:#8b97a8; --faint:#6b7686;
    --gold:#f5b942; --gold2:#ffd479; --sky:#5ec2ff; --good:#3fd68a; --good2:#7ff0bb;
    --warn:#ffb454; --bad:#ff6b6b; --line:rgba(255,255,255,.08);
    --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.018);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth} html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 75% -10%, #16202e 0%, var(--bg) 55%);
    background-attachment:fixed; color:var(--ink); min-height:100%;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden; font-feature-settings:"cv11","ss01";
  }
  a{color:inherit}
  .shell{max-width:42rem;margin:0 auto;display:flex;flex-direction:column;gap:2rem;padding:2rem 1.25rem 3rem}
  @media(min-width:640px){.shell{padding:2.5rem 1.25rem 4rem}}

  /* brand */
  .topbar{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.2px;color:var(--ink);font-size:16px}
  .logo{width:30px;height:30px;border-radius:50%;flex:none;position:relative;
    background:radial-gradient(circle at 35% 30%,var(--good2),var(--good) 55%,#1f7d54 100%);
    box-shadow:0 0 22px rgba(63,214,138,.45),inset 0 0 8px rgba(255,255,255,.35)}
  .logo::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(63,214,138,.25)}
  .topbar small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-top:-2px}

  /* stepper */
  .stepper{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;list-style:none}
  .step{display:flex;align-items:center;gap:.5rem}
  .pill{display:flex;align-items:center;gap:.5rem;border-radius:999px;padding:.375rem .75rem;font-size:.875rem;font-weight:600;transition:.15s}
  .pill .n{display:flex;height:1.25rem;width:1.25rem;align-items:center;justify-content:center;border-radius:999px;font-size:.75rem;font-weight:700}
  .pill.todo{background:rgba(255,255,255,.04);color:var(--faint);border:1px solid var(--line)} .pill.todo .n{background:rgba(255,255,255,.06);color:var(--muted)}
  .pill.active{background:linear-gradient(180deg,var(--good2),var(--good));color:#06140d;box-shadow:0 4px 16px rgba(63,214,138,.28)} .pill.active .n{background:rgba(6,20,13,.18);color:#06140d}
  .pill.done{background:rgba(63,214,138,.12);color:var(--good);border:1px solid rgba(63,214,138,.3)} .pill.done .n{background:rgba(63,214,138,.2);color:var(--good2)}
  .pill .lbl{display:none} @media(min-width:640px){.pill .lbl{display:inline}}
  .seg{height:1px;width:1rem;background:var(--line)}

  /* card */
  .card{background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;padding:2rem;
        box-shadow:0 24px 60px -28px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.02)}
  @media(min-width:640px){.card{padding:2.25rem}}
  h1{font-size:1.95rem;line-height:1.12;font-weight:720;letter-spacing:-.02em;
     background:linear-gradient(180deg,#fff,#b9c6d6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{margin-top:.85rem;font-size:1rem;color:var(--muted);line-height:1.55}
  .callout{margin-top:2rem;border:1px solid rgba(63,214,138,.3);background:linear-gradient(150deg,rgba(63,214,138,.12),rgba(63,214,138,.03));border-radius:16px;padding:1.25rem}
  .callout .t{font-size:.875rem;font-weight:700;color:var(--good2)}
  .callout .s{margin-top:.3rem;font-size:.78rem;color:var(--good);opacity:.85;line-height:1.5}
  .feats{margin-top:1.5rem;display:grid;gap:.6rem}
  @media(min-width:640px){.feats{grid-template-columns:1fr 1fr}}
  .feat{display:flex;align-items:center;gap:.6rem;font-size:.875rem;color:var(--ink)}
  .feat .ck{display:flex;height:1.3rem;width:1.3rem;flex:none;align-items:center;justify-content:center;border-radius:999px;
            background:rgba(63,214,138,.14);color:var(--good);font-size:.7rem;border:1px solid rgba(63,214,138,.3)}

  label.fld{display:block;margin-top:1.5rem}
  label.fld .lab{font-size:.875rem;font-weight:700;color:var(--ink)}
  label.fld .hint{font-size:.8rem;color:var(--muted);margin-top:.2rem}
  input[type=text],input[type=email],input[type=password]{width:100%;margin-top:.55rem;padding:.7rem .85rem;background:rgba(0,0,0,.35);
    border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);transition:.15s}
  input::placeholder{color:var(--faint)}
  input:focus{outline:none;border-color:var(--good);box-shadow:0 0 0 3px rgba(63,214,138,.15)}
  .helper{margin-top:.7rem;font-size:.78rem;color:var(--muted);line-height:1.55}
  .helper a{color:var(--good);font-weight:600;text-decoration:underline;text-underline-offset:2px}
  .helper b{color:var(--ink);font-weight:600}

  .row{margin-top:2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:11px;padding:.625rem 1.25rem;font-size:.875rem;font-weight:650;border:0;cursor:pointer;transition:.15s}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:linear-gradient(180deg,var(--good2),var(--good));color:#06140d;box-shadow:0 4px 16px rgba(63,214,138,.28)}
  .btn-primary:hover:not(:disabled){filter:brightness(1.06)}
  .btn-ghost{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--good);color:var(--good)}
  .btn-lg{padding:.8rem 1.5rem;font-size:.95rem;font-weight:700}

  /* discovery / cascade */
  .scan{margin-top:1.5rem;display:flex;align-items:center;gap:.75rem;color:var(--muted);font-size:.9rem}
  .ring{height:1.4rem;width:1.4rem;border-radius:999px;border:2.5px solid rgba(63,214,138,.2);border-top-color:var(--good);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .arrays{margin-top:1.25rem;display:flex;flex-direction:column;gap:.6rem}
  .achip{display:flex;align-items:center;gap:.85rem;border:1px solid var(--line);background:linear-gradient(170deg,var(--card),var(--card2));border-radius:14px;padding:.8rem .95rem;
          box-shadow:0 18px 44px -30px rgba(0,0,0,.7);opacity:0;transform:translateY(8px);animation:chip-in .5s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes chip-in{to{opacity:1;transform:translateY(0)}}
  .achip .dot{height:.6rem;width:.6rem;border-radius:999px;background:var(--good);box-shadow:0 0 0 4px rgba(63,214,138,.12),0 0 10px rgba(63,214,138,.5);flex:none}
  .achip .nm{font-weight:700;font-size:.9rem;color:var(--ink)}
  .achip .me{font-size:.78rem;color:var(--muted);margin-top:.1rem}
  .achip .kw{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}
  .achip .ck{margin-left:.4rem;color:var(--good)}
  .tally{margin-top:1.25rem;text-align:center;font-size:.9rem;color:var(--muted)}
  .tally b{color:var(--ink)}

  /* done */
  .center{display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;padding:1rem 0}
  .seal{height:4.5rem;width:4.5rem;border-radius:999px;display:grid;place-items:center;font-size:2rem;
        background:radial-gradient(circle at 38% 32%,var(--good2),var(--good));box-shadow:0 0 0 8px rgba(63,214,138,.1),0 10px 30px rgba(63,214,138,.4)}
  .done-h{font-size:1.6rem;font-weight:720;letter-spacing:-.02em;color:var(--ink)}
  .done-s{max-width:26rem;color:var(--muted);font-size:.95rem;line-height:1.55}

  .hidden{display:none}
  /* confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .cf{position:absolute;width:9px;height:9px;border-radius:2px;top:-12px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  /* vendor selector */
  .vendgrid{margin-top:1.5rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.6rem}
  .vend{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;text-align:left;cursor:pointer;
        border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:14px;padding:.75rem .85rem;transition:.15s;position:relative}
  .vend:hover{border-color:rgba(63,214,138,.45)}
  .vend.sel{border-color:var(--good);background:linear-gradient(150deg,rgba(63,214,138,.12),rgba(63,214,138,.03));box-shadow:0 0 0 1px rgba(63,214,138,.25),0 8px 24px -16px rgba(63,214,138,.5)}
  .vend.soon{cursor:not-allowed;opacity:.55}
  .vend.soon:hover{border-color:var(--line)}
  .vend .vn{font-size:.85rem;font-weight:700;color:var(--ink);line-height:1.2}
  .vend .vmeta{font-size:.7rem;color:var(--muted)}
  .vend .vtag{position:absolute;top:.55rem;right:.6rem;font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
              border-radius:6px;padding:1px 6px;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}
  .vend.sel .vrad{color:var(--good)}
  .vend .vrad{position:absolute;top:.55rem;right:.6rem;color:var(--faint);font-size:.85rem}
  .vendnote{margin-top:1.1rem;border:1px solid rgba(255,180,84,.3);background:rgba(255,180,84,.08);border-radius:12px;padding:.85rem 1rem;font-size:.78rem;color:var(--gold2);line-height:1.5}
  .vendnote b{color:#ffe7b8}

  /* value-reveal hero on the "your arrays" step (real-key path) */
  .valuehero{margin-top:1.4rem;border:1px solid rgba(63,214,138,.3);border-radius:18px;padding:1.2rem 1.4rem;
    background:linear-gradient(150deg,rgba(63,214,138,.14),rgba(63,214,138,.03));position:relative;overflow:hidden}
  .valuehero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle at 40% 40%,rgba(63,214,138,.4),rgba(63,214,138,.06) 60%,transparent 72%);pointer-events:none}
  .vh-lab{color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.01em}
  .vh-big{font-size:2.7rem;font-weight:780;letter-spacing:-.02em;color:var(--good2);line-height:1.05;margin-top:.3rem;
    text-shadow:0 0 24px rgba(63,214,138,.3);font-variant-numeric:tabular-nums}
  .vh-sub{color:var(--muted);font-size:.78rem;margin-top:.45rem;line-height:1.5}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><span class="logo"></span><span>Array Operator<small>by EnergyAgent</small></span></div>
  <nav aria-label="Setup progress">
    <ol class="stepper" id="stepper"></ol>
  </nav>
  <main id="main"></main>
</div>
<div id="confetti"></div>

<script>
// On the live domain, arrayoperator.com proxies /v1/* to the shared Railway
// backend via _redirects, so we stay same-origin (API_BASE = ""). On a local
// static preview (localhost:8088) there's no proxy, so point straight at the
// Railway backend — its CORS allow-list already includes localhost:8088, so the
// real preview/onboarding calls work and you see YOUR real arrays, not the demo.
const API_BASE = /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname)
  ? "https://web-production-49c83.up.railway.app"
  : "";
const STEPS = ["Welcome", "Connect", "Your arrays", "Done"];
let step = 0;
let state = { name:"", email:"", password:"", vendor:"solaredge", apiKey:"", fields:{}, sites:[], onboardingToken:"", sessionToken:"" };

// Inverter vendors — mirrors the backend registry order + metadata from
// api/inverters/ (VENDORS / vendor_catalog). SolarEdge is the only vendor with
// account-level multi-site discovery today; the rest connect per-array with
// their own credential fields. `discover:true` → uses the one-key cascade;
// otherwise we collect the vendor's fields and hand off to the dashboard's
// per-array connect (/v1/array-owners/arrays/{id}/inverter).
const VENDORS = [
  { code:"solaredge", label:"SolarEdge", meta:"One account key", available:true, discover:true,
    fields:[{name:"apiKey", label:"SolarEdge account API key", secret:true,
             hint:"The one key that unlocks every site on your account.",
             ph:"ABCD1234…", help:`Find it in your SolarEdge monitoring portal under <b>Admin → Site Access → API Access</b> (an <i>account</i>-level key, read-only). Don't have it handy? <a href="https://monitoring.solaredge.com" target="_blank" rel="noopener">Open the SolarEdge portal →</a>`}] },
  { code:"locus", label:"Locus Energy", meta:"SolarNOC", available:true, discover:false,
    note:"Locus needs API credentials (client ID/secret + your SolarNOC login) from your Locus account manager. Enter them and we'll connect your sites.",
    fields:[
      {name:"client_id", label:"Client ID"},
      {name:"client_secret", label:"Client Secret", secret:true},
      {name:"username", label:"SolarNOC username"},
      {name:"password", label:"SolarNOC password", secret:true},
      {name:"partner_id", label:"Partner ID (optional — shows every site at once)"},
    ] },
  { code:"fronius", label:"Fronius", meta:"Solar.web", available:true, discover:false,
    note:"Fronius Solar.web is a paid business API and isn't offered in the USA yet — US arrays may need the local LAN path. Enter your Solar.web keys to try the cloud connection.",
    fields:[
      {name:"access_key_id", label:"Access Key ID"},
      {name:"access_key_value", label:"Access Key Value", secret:true},
      {name:"pv_system_id", label:"PV System ID"},
    ] },
  { code:"sma", label:"SMA", meta:"Sunny Portal", available:true, discover:false,
    note:"SMA needs a developer app registration + owner consent. Endpoints are still being verified — enter your credentials and we'll take it from here.",
    fields:[
      {name:"client_id", label:"Client ID"},
      {name:"client_secret", label:"Client Secret", secret:true},
      {name:"system_id", label:"Plant / System ID"},
    ] },
  { code:"chint", label:"Chint / CPS", meta:"CSV for now", available:false, discover:false,
    note:"Chint/CPS has no public API yet, so there's nothing to paste — connect by uploading a production CSV from your dashboard after setup. We're tracking their FlexOM gateway for direct support." },
];
function vendorByCode(c){ return VENDORS.find(v=>v.code===c) || VENDORS[0]; }

const stepper = document.getElementById("stepper");
const main = document.getElementById("main");

function renderStepper(){
  stepper.innerHTML = STEPS.map((label,i)=>{
    const cls = i===step ? "active" : i<step ? "done" : "todo";
    const seg = i<STEPS.length-1 ? `<span class="seg"></span>` : "";
    return `<li class="step"><div class="pill ${cls}"><span class="n">${i+1}</span><span class="lbl">${label}</span></div>${seg}</li>`;
  }).join("");
}

function go(n){ step=n; renderStepper(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

// ---------- screens ----------
function welcomeScreen(){
  return `<div class="card animate">
    <h1>Your array, finally working for you.</h1>
    <p class="lede">Connect once, and your agent watches every panel for you — catching the quiet underperformer the day it starts, drafting the warranty claim when one dies, and showing you what your array is really worth. No spreadsheets. No installer jargon. No second-guessing.</p>
    <div class="callout">
      <div class="t">Free to set up · connect in under a minute · your data is yours</div>
      <div class="s">We only read your inverter's production data. Disconnect anytime and we purge it within 24 hours.</div>
    </div>
    <div class="feats">
      <div class="feat"><span class="ck">✓</span>One credential — every array appears</div>
      <div class="feat"><span class="ck">✓</span>Ground-truth, per-inverter health</div>
      <div class="feat"><span class="ck">✓</span>Plain-English alerts, in dollars</div>
      <div class="feat"><span class="ck">✓</span>Warranty claims drafted for you</div>
    </div>
    <div class="row">
      <span></span>
      <button class="btn btn-primary btn-lg" onclick="go(1)">Get started →</button>
    </div>
  </div>`;
}

function connectScreen(){
  const v = vendorByCode(state.vendor);
  const cards = VENDORS.map(vd=>{
    const sel = vd.code===state.vendor ? " sel" : "";
    const soon = vd.available ? "" : " soon";
    const tag = vd.discover ? `<span class="vtag">1 key</span>` : (vd.available ? "" : `<span class="vtag">soon</span>`);
    const rad = (vd.available && !vd.discover) ? `<span class="vrad">${sel?"●":"○"}</span>` : "";
    const onclick = vd.available ? `selectVendor('${vd.code}')` : "";
    return `<button type="button" class="vend${sel}${soon}" ${vd.available?`onclick="${onclick}"`:"aria-disabled=\"true\""}>
      ${tag}${rad}
      <span class="vn">${vd.label}</span>
      <span class="vmeta">${vd.meta}</span>
    </button>`;
  }).join("");

  const fieldsHtml = (v.fields||[]).map(f=>`
    <label class="fld">
      <span class="lab">${f.label}</span>
      ${f.hint?`<span class="hint">${f.hint}</span>`:""}
      <input type="${f.secret?"text":"text"}" id="fld_${f.name}" placeholder="${f.ph||""}"
             value="${(state.vendor==="solaredge"&&f.name==="apiKey")?state.apiKey:(state.fields[f.name]||"")}"
             oninput="setField('${f.name}',this.value)">
      ${f.help?`<div class="helper">${f.help}</div>`:""}
    </label>`).join("");

  const noteHtml = v.note ? `<div class="vendnote">${v.note}</div>` : "";
  const btnLabel = v.discover ? "Discover my arrays →" : (v.available ? "Connect my array →" : "Choose another brand");
  const lede = v.discover
    ? "Paste a single SolarEdge account key and every array on your account propagates in automatically — no site IDs, no per-panel setup, no logging in five times."
    : (v.available
        ? `Enter your ${v.label} credentials and we'll connect your ${v.label} sites and start watching them.`
        : `${v.label} doesn't offer a live connection yet.`);

  return `<div class="card animate">
    <h1>Connect once. We'll find them all.</h1>
    <p class="lede">${lede}</p>

    <label class="fld">
      <span class="lab">Your name</span>
      <input type="text" id="name" placeholder="Jane Owner" value="${state.name}" oninput="state.name=this.value;syncConnect()">
    </label>

    <label class="fld">
      <span class="lab">Where should we send your array's reports?</span>
      <input type="email" id="email" placeholder="you@example.com" value="${state.email}" oninput="state.email=this.value;syncConnect()">
    </label>

    <label class="fld">
      <span class="lab">Set a password <span style="color:var(--faint);font-weight:500">— optional</span></span>
      <span class="hint">So you can sign in anytime, no email link needed. 10+ characters with a letter and a number. Leave blank to sign in by emailed link.</span>
      <input type="password" id="password" autocomplete="new-password" placeholder="Create a password" value="${state.password||''}" oninput="state.password=this.value;syncConnect()">
      <div class="helper" id="pwHint"></div>
    </label>

    <div class="fld" style="margin-top:1.75rem">
      <span class="lab">Which inverter brand?</span>
      <span class="hint">Pick your monitoring platform — we support more than SolarEdge.</span>
      <div class="vendgrid">${cards}</div>
    </div>

    ${fieldsHtml}
    ${noteHtml}

    <div id="scanArea"></div>

    <div class="row">
      <button class="btn btn-ghost" onclick="go(0)">← Back</button>
      <button class="btn btn-primary btn-lg" id="discoverBtn" disabled onclick="connectVendor()">${btnLabel}</button>
    </div>
  </div>`;
}

function selectVendor(code){
  const v = vendorByCode(code);
  if(!v.available) return;
  state.vendor = code;
  render(); syncConnect();
}

function setField(name, val){
  if(state.vendor==="solaredge" && name==="apiKey"){ state.apiKey = val.trim(); }
  else { state.fields[name] = val; }
  syncConnect();
}

function syncConnect(){
  const v = vendorByCode(state.vendor);
  const b = document.getElementById("discoverBtn");
  if(!b) return;
  const emailOk = /.+@.+\..+/.test(state.email);
  const nameOk = (state.name||"").trim().length >= 2;
  // Password is OPTIONAL; if typed it must meet the backend rule (10+ chars,
  // a letter and a digit) or /start would 400. Surface a live hint.
  const pw = state.password || "";
  const pwOk = pw.length === 0 || (pw.length >= 10 && /[a-zA-Z]/.test(pw) && /[0-9]/.test(pw));
  const pwHint = document.getElementById("pwHint");
  if(pwHint) pwHint.textContent = (pw.length > 0 && !pwOk)
    ? "At least 10 characters, including a letter and a number." : "";
  if(!v.available){ b.disabled = true; return; }
  let credsOk;
  if(v.discover){ credsOk = state.apiKey.length>3; }
  else {
    // every non-optional field filled (labels with "optional" are skippable)
    credsOk = (v.fields||[]).every(f=>/optional/i.test(f.label) || (state.fields[f.name]||"").trim().length>0);
  }
  b.disabled = !(emailOk && nameOk && credsOk && pwOk);
}

// Vendor-aware pre-signup preview. EVERY available vendor now hits the public
// /preview endpoint so the owner sees their REAL site(s) + value before signup:
//  - SolarEdge / Locus(+partner) → list the whole account/partner
//  - Locus(no partner) / Fronius / SMA → preview the one named system
// Falls back to the demo cascade only when the backend is unreachable.
async function connectVendor(){
  const v = vendorByCode(state.vendor);
  const scan = document.getElementById("scanArea");
  const btn = document.getElementById("discoverBtn");
  btn.disabled = true;
  const verb = v.discover ? `Reaching your ${v.label} account…` : `Checking your ${v.label} system…`;
  scan.innerHTML = `<div class="scan"><span class="ring"></span> ${verb}</div>`;

  // Build the per-vendor config from the fields the connect form collected.
  const config = {};
  (v.fields||[]).forEach(f=>{
    const val = (f.name==="apiKey") ? state.apiKey : (state.fields[f.name]||"");
    if(val) config[f.name==="apiKey" ? "api_key" : f.name] = val.trim();
  });

  let sites = [];
  state.realSites = false;
  state.totals = null;
  try{
    const res = await fetch(`${API_BASE}/v1/array-owners/public/preview`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ vendor: state.vendor, config })
    });
    const data = await res.json().catch(()=>({}));
    if(res.status===429){
      scan.innerHTML = `<div class="helper" style="color:var(--warn)">${data.detail||"Too many attempts — give it a minute and try again."}</div>`;
      btn.disabled=false; return;
    }
    if(res.ok && data.ok && Array.isArray(data.sites) && data.sites.length){
      // Their actual array(s) — the sublime moment.
      sites = data.sites.map(s=>({...s, vendor: v.label}));
      state.realSites = true;
      state.totals = data.totals || null;
    } else if(res.ok && data.ok===false && data.message){
      // Friendly, actionable rejection (bad creds, scope, empty account).
      scan.innerHTML = `<div class="helper" style="color:var(--warn)">${data.message}</div>`;
      btn.disabled=false; return;
    } else {
      // Unexpected/empty — fall through to the demo cascade so the flow still
      // reaches account creation; the real creds are attached after sign-in.
      sites = demoSites();
    }
  }catch(e){
    // CORS/network/offline — graceful: show the propagation with sample data.
    sites = demoSites();
  }
  state.sites = sites;
  go(2);
}

function cascadeArrays(){
  const wrap = document.getElementById("arrays");
  const tally = document.getElementById("tally");
  const claim = document.getElementById("claimBtn");
  const vlabel = vendorByCode(state.vendor).label;
  const real = state.realSites;
  let totalKw = 0;
  state.sites.forEach((s,i)=>{
    totalKw += s.peak_power_kw||0;
    const brand = s.vendor || vlabel;
    const el = document.createElement("div");
    el.className = "achip";
    el.style.animationDelay = (i*0.16)+"s";
    const kw = (s.peak_power_kw||0) > 0 ? `${(s.peak_power_kw||0).toFixed(1)} kW` : "";
    // Real previews carry a per-array annual $ estimate from the backend.
    const val = (real && s.annual_value_usd>0)
      ? `<span class="kw">~$${Number(s.annual_value_usd).toLocaleString()}/yr</span>`
      : (kw ? `<span class="kw">${kw}</span>` : "");
    const meta = [brand, kw && real ? kw : (real?"":""), "site "+s.site_id].filter(Boolean).join(" · ");
    el.innerHTML = `<span class="dot"></span>
      <div><div class="nm">${(s.name||("Site "+s.site_id))}</div><div class="me">${meta}</div></div>
      ${val}<span class="ck">✓</span>`;
    wrap.appendChild(el);
  });
  const settle = state.sites.length*160 + 500;
  setTimeout(()=>{
    const kwTxt = totalKw>0 ? ` · <b>${totalKw.toFixed(1)} kW</b>` : "";
    tally.innerHTML = `<b>${state.sites.length} ${state.sites.length===1?"array":"arrays"}</b>${kwTxt} ${real?"ready":"in preview"}. Weather-normalized, per-inverter, in dollars.`;
    claim.style.opacity="1"; claim.style.pointerEvents="auto";
    // Count the annual-value hero up to the real total for the sublime reveal.
    if(real && state.totals && state.totals.annual_value_usd>0){
      countUp(document.getElementById("vhBig"), state.totals.annual_value_usd, 1100);
    }
  }, settle);
}

// Animate a dollar figure from 0 → target over `ms` (eased), tabular $.
function countUp(el, target, ms){
  if(!el) return;
  const start = performance.now();
  const fmt = n => "$"+Math.round(n).toLocaleString();
  function tick(now){
    const t = Math.min((now-start)/ms, 1);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = fmt(target*eased);
    if(t<1) requestAnimationFrame(tick);
    else el.textContent = fmt(target);
  }
  requestAnimationFrame(tick);
}

function doneScreen(){
  const n = state.sites.length;
  const existing = !!state.existing;
  const created = !!state.onboardingToken && !existing;
  const signedIn = created && !!state.sessionToken;
  const trialLine = existing
    ? `You already have an Array Operator account. We just emailed <b>${state.email}</b> a secure sign-in link to open your dashboard.`
    : (!created
    ? `We couldn't reach our servers just now, so your account isn't created yet. No problem — your details and key were not stored. Try again in a moment.`
    : (signedIn
        ? `Your <b>14-day free trial</b> is live — no card needed. You're already signed in; open your dashboard below.`
        : `Your <b>14-day free trial</b> is live — no card needed. We just emailed <b>${state.email}</b> a secure sign-in link to open your dashboard.`));
  let cardCta;
  if(existing){
    // Returning user: link is already on its way. Give them a direct way in too.
    cardCta = `<a class="btn btn-primary btn-lg" href="/?fresh=1" target="_blank" rel="noopener">Open dashboard →</a>
       <div class="helper" style="text-align:center">Open the link we just emailed you, or sign in from the dashboard.</div>`;
  } else if(!created){
    cardCta = `<button class="btn btn-primary btn-lg" onclick="finish()">Try again →</button>`;
  } else if(signedIn){
    // Same-origin session is stashed — go straight in (no new tab, no magic link).
    cardCta = `<button class="btn btn-primary btn-lg" onclick="goDashboard()">Open my dashboard →</button>
       <button class="btn btn-ghost" id="addCardBtn" onclick="addCard()">Add a card to stay on after the trial</button>
       <div class="helper" id="cardNote" style="text-align:center">Optional now — you're only billed for the kWh your arrays generate, and never until the trial ends.</div>`;
  } else {
    cardCta = `<button class="btn btn-primary btn-lg" id="addCardBtn" onclick="addCard()">Add a card to stay on after the trial →</button>
       <div class="helper" id="cardNote" style="text-align:center">Optional now — you're only billed for the kWh your arrays generate, and never until the trial ends.</div>`;
  }
  return `<div class="card animate"><div class="center">
    <div class="seal">🌿</div>
    <div class="done-h">${existing ? "Welcome back." : (created ? "You're set. We've got it from here." : "Almost there.")}</div>
    <div class="done-s">${trialLine}</div>
    ${existing ? "" : `<div class="done-s">${state.arraysConnected
      ? `All ${n} ${n===1?"array is":"arrays are"} <b>connected and being watched right now</b> — weather-normalized, per-inverter, in dollars.`
      : `All ${n} ${n===1?"array is":"arrays are"} queued for watching — weather-normalized, per-inverter, in dollars.`}</div>`}
    <div style="display:flex;flex-direction:column;gap:.6rem;align-items:center;margin-top:.5rem">
      ${cardCta}
      ${created && !signedIn ? `<a class="btn btn-ghost" href="/?fresh=1" target="_blank" rel="noopener">Open dashboard</a>` : ""}
    </div>
  </div></div>`;
}

// Go straight to the Array Operator owner dashboard (the site root index.html,
// rendered by app.js). Same-origin: the so_session we stashed at completion is
// read by app.js → live /v1/array-owners/overview. NOT /accounts (that proxies
// to the NEPOOL verifier SPA — wrong product for an array owner).
function goDashboard(){
  window.location.assign(`/?fresh=1&t=${Date.now()}`);
}

// Create the trialing Array Operator account, then mint a session so we can
// offer the add-card step inline. The trial is identical to NEPOOL (14 days,
// no card). On any network/CORS failure we fail gracefully — nothing stored.
async function finish(){
  go(3);
  burst();
  const company = state.sites.length ? `${vendorByCode(state.vendor).label} owner` : null;
  try{
    const startRes = await fetch(`${API_BASE}/v1/onboarding/start`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        email: state.email.trim(),
        full_name: state.name.trim(),
        company,
        array_count: Math.max(state.sites.length, 1),
        product: "array_operator",
        ...(state.password ? { password: state.password } : {}),
      })
    });
    const startData = await startRes.json().catch(()=>({}));
    if(startRes.ok && startData.onboarding_token){
      state.onboardingToken = startData.onboarding_token;
      // Complete onboarding → marks done, emails magic link, mints a session.
      try{
        const compRes = await fetch(`${API_BASE}/v1/onboarding/complete?token=${encodeURIComponent(state.onboardingToken)}`, {
          method:"POST", headers:{"Content-Type":"application/json"}, body: "{}"
        });
        const compData = await compRes.json().catch(()=>({}));
        if(compRes.ok && compData.session_token){
          state.sessionToken = compData.session_token;
          // Same-origin with the dashboard (/accounts on arrayoperator.com), so
          // stash the freshly-minted session under the key the dashboard SPA
          // reads (so_session). The "Open my dashboard" CTA then lands them
          // already signed in — no email magic-link detour.
          try{ localStorage.setItem("so_session", compData.session_token); }catch(e){}
        }
      }catch(e){ /* session is a bonus; magic-link email is the fallback */ }
      // Attach the real credential now using the freshly-minted session — so
      // their dashboard is populated the instant they sign in (no re-pasting).
      // SolarEdge/Locus attach the whole account; Fronius/SMA attach the one
      // system. Best-effort: a failure never blocks the trial.
      if(state.sessionToken && state.realSites){
        try{
          const v = vendorByCode(state.vendor);
          const hdr = {"Content-Type":"application/json","Authorization":`Bearer ${state.sessionToken}`};
          let conn, cd;
          if(state.vendor==="solaredge" && state.apiKey){
            conn = await fetch(`${API_BASE}/v1/array-owners/solaredge/connect-account`, {
              method:"POST", headers:hdr, body: JSON.stringify({api_key: state.apiKey})
            });
            cd = await conn.json().catch(()=>({}));
            state.arraysConnected = !!(conn.ok && (cd.connected || cd.created || cd.matched));
          } else if(state.vendor==="locus" && (state.fields.partner_id||"").trim()){
            conn = await fetch(`${API_BASE}/v1/array-owners/locus/connect-account`, {
              method:"POST", headers:hdr, body: JSON.stringify({
                client_id: state.fields.client_id, client_secret: state.fields.client_secret,
                username: state.fields.username, password: state.fields.password,
                partner_id: parseInt(state.fields.partner_id, 10)
              })
            });
            cd = await conn.json().catch(()=>({}));
            state.arraysConnected = !!(conn.ok && (cd.connected || cd.created || cd.matched));
          } else {
            // Single-system vendors (Fronius, SMA, Locus without a partner_id):
            // build the config from the collected fields and attach one array.
            const config = {};
            (v.fields||[]).forEach(f=>{
              const val = (f.name==="apiKey") ? state.apiKey : (state.fields[f.name]||"");
              if(val) config[f.name==="apiKey" ? "api_key" : f.name] = val.trim();
            });
            conn = await fetch(`${API_BASE}/v1/array-owners/connect-single`, {
              method:"POST", headers:hdr, body: JSON.stringify({vendor: state.vendor, config})
            });
            cd = await conn.json().catch(()=>({}));
            state.arraysConnected = !!(conn.ok && cd.ok && cd.array_id);
          }
        }catch(e){ /* will connect from dashboard if this didn't land */ }
      }
    } else if(startRes.status === 409){
      // Account already exists — no new trial to mint. Send a REAL sign-in
      // link via the public auth-request endpoint (always 200, never leaks
      // who's registered) so the "check your email" copy is actually true,
      // then route them to sign in.
      state.existing = true;
      state.onboardingToken = "exists";
      try{
        await fetch(`${API_BASE}/v1/auth/request`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ email: state.email.trim() })
        });
      }catch(e){ /* link send is best-effort; copy still routes them to sign in */ }
    }
  }catch(e){ /* CORS/offline — doneScreen shows the graceful retry path */ }
  // Re-render the done screen now that we know whether the account was created.
  if(step===3) main.innerHTML = doneScreen();
}

// Open Stripe Checkout (setup mode) to save a card. Reuses the dashboard's
// /v1/account/add-payment-method endpoint with the session we just minted.
async function addCard(){
  const note = document.getElementById("cardNote");
  const btn = document.getElementById("addCardBtn");
  if(!state.sessionToken){
    if(note){ note.innerHTML = `Open your dashboard from the sign-in link we emailed to <b>${state.email}</b>, then add a card from Settings.`; }
    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = "Opening secure checkout…"; }
  try{
    const r = await fetch(`${API_BASE}/v1/account/add-payment-method`, {
      method:"POST", headers:{"Authorization":`Bearer ${state.sessionToken}`}
    });
    const d = await r.json().catch(()=>({}));
    if(r.ok && d.checkout_url){ window.location.href = d.checkout_url; return; }
    if(note){ note.innerHTML = `Couldn't open checkout right now — you can add a card anytime from your dashboard.`; note.style.color = "var(--warn)"; }
  }catch(e){
    if(note){ note.innerHTML = `Couldn't reach checkout from here — add a card later from your dashboard.`; note.style.color = "var(--warn)"; }
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "Add a card to stay on after the trial →"; }
  }
}

function burst(){
  const c = document.getElementById("confetti");
  const colors = ["#34d399","#10b981","#6ee7b7","#a7f3d0","#059669"];
  for(let i=0;i<80;i++){
    const p=document.createElement("div");
    p.className="cf";
    p.style.left=Math.random()*100+"vw";
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(2.5+Math.random()*2)+"s";
    p.style.animationDelay=(Math.random()*0.6)+"s";
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    c.appendChild(p);
    setTimeout(()=>p.remove(), 5200);
  }
}

function render(){
  if(step===0) main.innerHTML = welcomeScreen();
  else if(step===1){ main.innerHTML = connectScreen(); syncConnect(); }
  else if(step===2){ main.innerHTML = arraysScreen(); cascadeArrays(); }
  else if(step===3) main.innerHTML = doneScreen();
}

renderStepper(); render();
</script>
