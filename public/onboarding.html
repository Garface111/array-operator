<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up your arrays · Array Operator</title>
<!-- Day/night theme: set the attribute BEFORE first paint so there's no flash. -->
<script>(function(){try{if(localStorage.getItem("ao_theme")!=="night")document.documentElement.setAttribute("data-theme","day");}catch(e){document.documentElement.setAttribute("data-theme","day");}})();</script>
<link rel="icon" type="image/svg+xml" href="favicon-day.svg"><!-- day(blue) is the default skin -->
<style>
  /* Design language matched to array-operator-ea.netlify.app (styles.css):
     sun-mirror DARK palette — #0a0e14 radial bg, #3fd68a green accent,
     glassy gradient cards, glowing green buttons, plain-English voice. */
  :root{
    --bg:#0a0e14; --bg2:#0e131c; --ink:#eaf0f7; --muted:#8b97a8; --faint:#6b7686;
    --gold:#f5b942; --gold2:#ffd479; --sky:#5ec2ff; --good:#3fd68a; --good2:#7ff0bb;
    --warn:#ffb454; --bad:#ff6b6b; --line:rgba(255,255,255,.08);
    --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.018);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth} html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 75% -10%, #16202e 0%, var(--bg) 55%);
    background-attachment:fixed; color:var(--ink); min-height:100%;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden; font-feature-settings:"cv11","ss01";
  }
  a{color:inherit}
  .shell{max-width:42rem;margin:0 auto;display:flex;flex-direction:column;gap:2rem;padding:2rem 1.25rem 3rem}
  @media(min-width:640px){.shell{padding:2.5rem 1.25rem 4rem}}

  /* brand */
  .topbar{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.2px;color:var(--ink);font-size:16px}
  .logo{width:30px;height:30px;border-radius:50%;flex:none;position:relative;
    background:radial-gradient(circle at 35% 30%,var(--good2),var(--good) 55%,#1f7d54 100%);
    box-shadow:0 0 22px rgba(63,214,138,.45),inset 0 0 8px rgba(255,255,255,.35)}
  .logo::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(63,214,138,.25)}
  .topbar small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-top:-2px}

  /* stepper */
  .stepper{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;list-style:none}
  .step{display:flex;align-items:center;gap:.5rem}
  .pill{display:flex;align-items:center;gap:.5rem;border-radius:999px;padding:.375rem .75rem;font-size:.875rem;font-weight:600;transition:.15s}
  .pill .n{display:flex;height:1.25rem;width:1.25rem;align-items:center;justify-content:center;border-radius:999px;font-size:.75rem;font-weight:700}
  .pill.todo{background:rgba(255,255,255,.04);color:var(--faint);border:1px solid var(--line)} .pill.todo .n{background:rgba(255,255,255,.06);color:var(--muted)}
  .pill.active{background:linear-gradient(180deg,var(--good2),var(--good));color:#06140d;box-shadow:0 4px 16px rgba(63,214,138,.28)} .pill.active .n{background:rgba(6,20,13,.18);color:#06140d}
  .pill.done{background:rgba(63,214,138,.12);color:var(--good);border:1px solid rgba(63,214,138,.3)} .pill.done .n{background:rgba(63,214,138,.2);color:var(--good2)}
  .pill .lbl{display:none} @media(min-width:640px){.pill .lbl{display:inline}}
  .seg{height:1px;width:1rem;background:var(--line)}

  /* card */
  .card{background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;padding:2rem;
        box-shadow:0 24px 60px -28px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.02)}
  @media(min-width:640px){.card{padding:2.25rem}}
  h1{font-size:1.95rem;line-height:1.22;font-weight:720;letter-spacing:-.02em;padding-bottom:.14em;
     background:linear-gradient(180deg,#fff,#b9c6d6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{margin-top:.85rem;font-size:1rem;color:var(--muted);line-height:1.55}
  .callout{margin-top:2rem;border:1px solid rgba(63,214,138,.3);background:linear-gradient(150deg,rgba(63,214,138,.12),rgba(63,214,138,.03));border-radius:16px;padding:1.25rem}
  .callout .t{font-size:.875rem;font-weight:700;color:var(--good2)}
  .callout .s{margin-top:.3rem;font-size:.78rem;color:var(--good);opacity:.85;line-height:1.5}
  .feats{margin-top:1.5rem;display:grid;gap:.6rem}
  @media(min-width:640px){.feats{grid-template-columns:1fr 1fr}}
  .feat{display:flex;align-items:center;gap:.6rem;font-size:.875rem;color:var(--ink)}
  .feat .ck{display:flex;height:1.3rem;width:1.3rem;flex:none;align-items:center;justify-content:center;border-radius:999px;
            background:rgba(63,214,138,.14);color:var(--good);font-size:.7rem;border:1px solid rgba(63,214,138,.3)}

  label.fld{display:block;margin-top:1.5rem}
  label.fld .lab{font-size:.875rem;font-weight:700;color:var(--ink)}
  label.fld .hint{font-size:.8rem;color:var(--muted);margin-top:.2rem}
  input[type=text],input[type=email],input[type=password]{width:100%;margin-top:.55rem;padding:.7rem .85rem;background:rgba(0,0,0,.35);
    border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);transition:.15s}
  input::placeholder{color:var(--faint)}
  input:focus{outline:none;border-color:var(--good);box-shadow:0 0 0 3px rgba(63,214,138,.15)}
  .helper{margin-top:.7rem;font-size:.78rem;color:var(--muted);line-height:1.55}
  .helper a{color:var(--good);font-weight:600;text-decoration:underline;text-underline-offset:2px}
  .helper b{color:var(--ink);font-weight:600}

  .row{margin-top:2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:11px;padding:.625rem 1.25rem;font-size:.875rem;font-weight:650;border:0;cursor:pointer;transition:.15s}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:linear-gradient(180deg,var(--good2),var(--good));color:#06140d;box-shadow:0 4px 16px rgba(63,214,138,.28)}
  .btn-primary:hover:not(:disabled){filter:brightness(1.06)}
  .btn-ghost{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--good);color:var(--good)}
  .btn-lg{padding:.8rem 1.5rem;font-size:.95rem;font-weight:700}

  /* discovery / cascade */
  .scan{margin-top:1.5rem;display:flex;align-items:center;gap:.75rem;color:var(--muted);font-size:.9rem}
  .ring{height:1.4rem;width:1.4rem;border-radius:999px;border:2.5px solid rgba(63,214,138,.2);border-top-color:var(--good);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .arrays{margin-top:1.25rem;display:flex;flex-direction:column;gap:.6rem}
  .achip{display:flex;align-items:center;gap:.85rem;border:1px solid var(--line);background:linear-gradient(170deg,var(--card),var(--card2));border-radius:14px;padding:.8rem .95rem;
          box-shadow:0 18px 44px -30px rgba(0,0,0,.7);opacity:0;transform:translateY(8px);animation:chip-in .5s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes chip-in{to{opacity:1;transform:translateY(0)}}
  .achip .dot{height:.6rem;width:.6rem;border-radius:999px;background:var(--good);box-shadow:0 0 0 4px rgba(63,214,138,.12),0 0 10px rgba(63,214,138,.5);flex:none}
  .achip .nm{font-weight:700;font-size:.9rem;color:var(--ink)}
  .achip .me{font-size:.78rem;color:var(--muted);margin-top:.1rem}
  .achip .kw{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}
  .achip .ck{margin-left:.4rem;color:var(--good)}
  .tally{margin-top:1.25rem;text-align:center;font-size:.9rem;color:var(--muted)}
  .tally b{color:var(--ink)}

  /* done */
  .center{display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;padding:1rem 0}
  .seal{height:4.5rem;width:4.5rem;border-radius:999px;display:grid;place-items:center;font-size:2rem;
        background:radial-gradient(circle at 38% 32%,var(--good2),var(--good));box-shadow:0 0 0 8px rgba(63,214,138,.1),0 10px 30px rgba(63,214,138,.4)}
  .done-h{font-size:1.6rem;font-weight:720;letter-spacing:-.02em;color:var(--ink)}
  .done-s{max-width:26rem;color:var(--muted);font-size:.95rem;line-height:1.55}

  .hidden{display:none}
  /* confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .cf{position:absolute;width:9px;height:9px;border-radius:2px;top:-12px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  /* vendor selector */
  .vendgrid{margin-top:1.5rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.6rem}
  .vend{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;text-align:left;cursor:pointer;
        border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:14px;padding:.75rem .85rem;transition:.15s;position:relative}
  .vend:hover{border-color:rgba(63,214,138,.45)}
  .vend.sel{border-color:var(--good);background:linear-gradient(150deg,rgba(63,214,138,.12),rgba(63,214,138,.03));box-shadow:0 0 0 1px rgba(63,214,138,.25),0 8px 24px -16px rgba(63,214,138,.5)}
  .vend.soon{cursor:not-allowed;opacity:.55}
  .vend.soon:hover{border-color:var(--line)}
  .vend .vn{font-size:.85rem;font-weight:700;color:var(--ink);line-height:1.2}
  .vend .vmeta{font-size:.7rem;color:var(--muted)}
  .vend .vtag{position:absolute;top:.55rem;right:.6rem;font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
              border-radius:6px;padding:1px 6px;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}
  .vend.sel .vrad{color:var(--good)}
  .vend .vrad{position:absolute;top:.55rem;right:.6rem;color:var(--faint);font-size:.85rem}
  .vendnote{margin-top:1.1rem;border:1px solid rgba(255,180,84,.3);background:rgba(255,180,84,.08);border-radius:12px;padding:.85rem 1rem;font-size:.78rem;color:var(--gold2);line-height:1.5}
  .vendnote b{color:#ffe7b8}

  /* value-reveal hero on the "your arrays" step (real-key path) */
  .valuehero{margin-top:1.4rem;border:1px solid rgba(63,214,138,.3);border-radius:18px;padding:1.2rem 1.4rem;
    background:linear-gradient(150deg,rgba(63,214,138,.14),rgba(63,214,138,.03));position:relative;overflow:hidden}
  .valuehero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle at 40% 40%,rgba(63,214,138,.4),rgba(63,214,138,.06) 60%,transparent 72%);pointer-events:none}
  .vh-lab{color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.01em}
  .vh-big{font-size:2.7rem;font-weight:780;letter-spacing:-.02em;color:var(--good2);line-height:1.05;margin-top:.3rem;
    text-shadow:0 0 24px rgba(63,214,138,.3);font-variant-numeric:tabular-nums}
  .vh-sub{color:var(--muted);font-size:.78rem;margin-top:.45rem;line-height:1.5}

  /* Day/night toggle control (top bar, right) */
  .theme-toggle{margin-left:auto;cursor:pointer;border:1px solid var(--line);background:var(--card);
    color:var(--muted);width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;
    font-size:15px;line-height:1;transition:color .15s,border-color .15s,background .15s}
  .theme-toggle:hover{color:var(--good);border-color:var(--good)}
  .theme-toggle .tt-ico{line-height:1;pointer-events:none}

  /* ===== DAY MODE (default) — utility-blue on cool slate ===== */
  html[data-theme="day"]{
    --bg:#f6f8fb; --bg2:#eef2f7; --ink:#0f172a; --muted:#64748b; --faint:#94a3b8;
    --gold:#d97706; --gold2:#b45309; --sky:#0891b2; --good:#2563eb; --good2:#0ea5e9;
    --warn:#d97706; --bad:#dc2626; --line:#e2e8f0; --card:#ffffff; --card2:#f8fafc;
    color-scheme:light;
  }
  html[data-theme="day"] body{background:radial-gradient(1200px 700px at 75% -10%, #eef3fb 0%, #f6f8fb 55%);}
  html[data-theme="day"] h1{background:linear-gradient(180deg,#0f172a,#475569);-webkit-background-clip:text;background-clip:text;color:transparent;}
  html[data-theme="day"] .logo{background:radial-gradient(circle at 35% 30%,#60a5fa,#2563eb 55%,#1d4ed8 100%);box-shadow:0 0 0 4px rgba(37,99,235,.1),0 6px 18px rgba(37,99,235,.32);}
  html[data-theme="day"] .pill.todo{background:#ffffff;}
  html[data-theme="day"] .pill.todo .n{background:#eef2f7;}
  html[data-theme="day"] .pill.active{color:#fff;}
  html[data-theme="day"] .pill.active .n{background:rgba(255,255,255,.28);color:#fff;}
  html[data-theme="day"] input[type=text],
  html[data-theme="day"] input[type=email],
  html[data-theme="day"] input[type=password]{background:#ffffff;color:var(--ink);}
  html[data-theme="day"] input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15);}
  html[data-theme="day"] .btn-primary{background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 4px 14px -4px rgba(29,78,216,.45);}
  html[data-theme="day"] .btn-ghost{background:#ffffff;}
  html[data-theme="day"] .vend{background:#ffffff;}
  html[data-theme="day"] .vend .vtag{background:#eef2f7;}
  html[data-theme="day"] .vendnote b{color:#b45309;}
  html[data-theme="day"] .card{box-shadow:0 10px 30px -14px rgba(15,23,42,.14),0 0 0 1px rgba(15,23,42,.03);}
  html[data-theme="day"] .achip{box-shadow:0 6px 18px -10px rgba(15,23,42,.16);}
  html[data-theme="day"] .vh-big{text-shadow:none;}
  html[data-theme="day"] .pill.active{box-shadow:0 4px 16px rgba(37,99,235,.28);}
  html[data-theme="day"] .callout{background:linear-gradient(150deg,rgba(37,99,235,.10),rgba(37,99,235,.03));border-color:rgba(37,99,235,.3);}
  html[data-theme="day"] .ck{background:rgba(37,99,235,.12);border-color:rgba(37,99,235,.3);}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><span class="logo"></span><span>Array Operator<small>by EnergyAgent</small></span>
    <button class="theme-toggle" id="themeToggle" type="button"
            title="Toggle day / night" aria-label="Toggle day or night theme">
      <span class="tt-ico" aria-hidden="true">☾</span>
    </button>
  </div>
  <script>
    /* Day/night toggle — persists in localStorage (ao_theme), shared sitewide. */
    (function(){
      var btn = document.getElementById("themeToggle");
      function read(){ try { return localStorage.getItem("ao_theme") !== "night"; } catch(e){ return true; } }
      function apply(day){
        document.documentElement.setAttribute("data-theme", day ? "day" : "night");
        if (btn){ var i = btn.querySelector(".tt-ico"); if (i) i.textContent = day ? "☀" : "☾"; }
      }
      var day = read(); apply(day);
      if (btn) btn.addEventListener("click", function(){
        day = !day;
        try { localStorage.setItem("ao_theme", day ? "day" : "night"); } catch(e){}
        apply(day);
      });
    })();
  </script>
  <nav aria-label="Setup progress">
    <ol class="stepper" id="stepper"></ol>
  </nav>
  <main id="main"></main>
</div>
<div id="confetti"></div>

<script>
// On the live domain, arrayoperator.com proxies /v1/* to the shared Railway
// backend via _redirects, so we stay same-origin (API_BASE = ""). On a local
// static preview (localhost:8088) there's no proxy, so point straight at the
// Railway backend — its CORS allow-list already includes localhost:8088, so the
// real preview/onboarding calls work and you see YOUR real arrays, not the demo.
const API_BASE = /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname)
  ? "https://web-production-49c83.up.railway.app"
  : "";
const STEPS = ["Welcome", "Connect", "Your arrays", "Done"];
let step = 0;
// Bump when the Terms / Privacy / authorization language materially changes; the
// version a user accepted is persisted server-side at account creation for audit.
const CONSENT_VERSION = "2026-06-27";
let state = { name:"", email:"", password:"", vendor:"solaredge", apiKey:"", fields:{}, sites:[], onboardingToken:"", sessionToken:"", consent:false, syncingAll:false, captures:{}, syncStatus:{} };
// ── "Find all my arrays" — the one-click wow ────────────────────────────────
// After the extension is installed, one click fans it out across EVERY
// extension-login vendor at once. Captures ACCUMULATE (deduped) across vendors
// into state.sites instead of the last one winning, so the final count reflects
// every array on every platform. state.captures keeps each vendor's raw payload
// so finish() can persist them all after signup.
const SYNC_ALL_VENDORS = ["solaredge","fronius","sma","chint"];
const SYNC_ALL_LABEL = { solaredge:"SolarEdge", fronius:"Fronius", sma:"SMA", chint:"Chint" };
let _syncAllTimer = null, _settleTimer = null;
function _siteKey(s, label){ return String(s.site_id)+"|"+(label||s.vendor||""); }
function mergeSites(newSites, label){
  let added = 0;
  const have = new Set(state.sites.map(s => _siteKey(s)));
  (newSites||[]).forEach(s => {
    const k = _siteKey(s, label);
    if (!have.has(k)) { state.sites.push(Object.assign({}, s, label?{vendor:label}:{})); have.add(k); added++; }
  });
  return added;
}

// The required agree-to-terms + authorize-account-access gate shown at the email
// (account-creation) step. Themed via the same CSS vars as the rest of the flow.
function consentField(){
  return `<label class="fld" id="consentFld" style="display:flex;gap:.55rem;align-items:flex-start;margin-top:1.1rem;cursor:pointer">
    <input type="checkbox" id="consentChk" onchange="state.consent=this.checked;syncClaim()" ${state.consent?"checked":""} style="width:auto;margin-top:.15rem;flex:0 0 auto;accent-color:var(--good)">
    <span class="hint" style="margin-top:0">I agree to the <a href="/terms.html" target="_blank" rel="noopener" style="color:var(--good);text-decoration:underline">Terms of Service</a> and <a href="/privacy.html" target="_blank" rel="noopener" style="color:var(--good);text-decoration:underline">Privacy Policy</a>, and I authorize EnergyAgent to access the accounts I connect, on my behalf, to read my production and billing data.</span>
  </label>`;
}

// Inverter vendors — mirrors the backend registry order + metadata from
// api/inverters/ (VENDORS / vendor_catalog). SolarEdge is the only vendor with
// account-level multi-site discovery today; the rest connect per-array with
// their own credential fields. `discover:true` → uses the one-key cascade;
// otherwise we collect the vendor's fields and hand off to the dashboard's
// per-array connect (/v1/array-owners/arrays/{id}/inverter).
const VENDORS = [
  { code:"solaredge", label:"SolarEdge", meta:"One account key", available:true, discover:true,
    fields:[{name:"apiKey", label:"SolarEdge account API key", secret:true,
             hint:"The one key that unlocks every site on your account.",
             ph:"ABCD1234…", help:`Find it in your SolarEdge monitoring portal under <b>Admin → Site Access → API Access</b> (an <i>account</i>-level key, read-only). Don't have it handy? <a href="https://monitoring.solaredge.com" target="_blank" rel="noopener">Open the SolarEdge portal →</a>`}] },
  { code:"enphase", label:"Enphase", meta:"Enlighten", available:false, discover:false,
    note:"Enphase connects through the Enlighten developer API — paste your Enphase app key + client ID/secret and your System ID. We're in final verification against live Enphase accounts, and a one-click owner sign-in is on the way.",
    fields:[
      {name:"api_key", label:"Enphase API key", secret:true,
       help:`From the <a href="https://developer-v4.enphase.com" target="_blank" rel="noopener">Enphase developer portal →</a> your app's <b>API key</b>.`},
      {name:"client_id", label:"App Client ID"},
      {name:"client_secret", label:"App Client Secret", secret:true},
      {name:"system_id", label:"System ID", hint:"Your Enlighten system ID."},
    ] },
  { code:"solis", label:"Solis", meta:"SolisCloud", available:false, discover:false,
    note:"Solis connects through the SolisCloud Platform API. In SolisCloud, open API Management and request an API key (KeyId + KeySecret), then paste them here. We're in final verification against live Solis accounts.",
    fields:[
      {name:"key_id", label:"SolisCloud KeyId"},
      {name:"key_secret", label:"SolisCloud KeySecret", secret:true},
      {name:"station_id", label:"Station ID (optional)"},
    ] },
  { code:"tigo", label:"Tigo", meta:"Energy Intelligence", available:false, discover:false,
    note:"Tigo connects with your Energy Intelligence (EI) login — the API needs a Premium data subscription on your Tigo account. We're in final verification against live Tigo accounts.",
    fields:[
      {name:"username", label:"Tigo EI username"},
      {name:"password", label:"Tigo EI password", secret:true},
      {name:"system_id", label:"System ID (optional)"},
    ] },
  { code:"locus", label:"Locus Energy", meta:"SolarNOC", available:true, discover:false,
    note:"Locus needs API credentials (client ID/secret + your SolarNOC login) from your Locus account manager. Enter them and we'll connect your sites.",
    fields:[
      {name:"client_id", label:"Client ID"},
      {name:"client_secret", label:"Client Secret", secret:true},
      {name:"username", label:"SolarNOC username"},
      {name:"password", label:"SolarNOC password", secret:true},
      {name:"partner_id", label:"Partner ID (optional — shows every site at once)"},
    ] },
  { code:"alsoenergy", label:"AlsoEnergy", meta:"PowerTrack", available:true, discover:false,
    note:"Sign in with your AlsoEnergy / PowerTrack portal login — the same username & password you use at hmi.alsoenergy.com. Add a Site ID to connect one site.",
    fields:[
      {name:"username", label:"AlsoEnergy username"},
      {name:"password", label:"AlsoEnergy password", secret:true},
      {name:"site_id", label:"Site ID", hint:"Found in your PowerTrack site URL."},

// ── Extension bridge: zero-key SolarEdge connect ──────────────────────────
// The EnergyAgent extension injects so_bridge.js on arrayoperator.com, which
// announces SO_EXTENSION_PRESENT and relays SO_CAPTURE_LANDED. When present we
// offer "Log in with SolarEdge" — the owner signs into the portal they already
// use, the extension READS their durable account API key, and it lands here.
// We then run the SAME /public/preview reveal + connect flow as the paste path.
let EXT_PRESENT = false;
// The EnergyAgent helper on the Chrome Web Store (same extension NEPOOL Operator
// uses — it gains SolarEdge + arrayoperator.com support in v1.8.0).
const EXT_STORE_URL = "https://chromewebstore.google.com/detail/solar-operator-sync/ocohbimolfpnkjcjhiodopjjlhclinpl";
function extSend(type, extra){
  try { window.postMessage(Object.assign({ type, reqId: String(Date.now())+Math.random() }, extra||{}), "*"); } catch(e){}
}
function extInstallClicked(){
  const w = document.getElementById("extWatch");
  if (w) w.innerHTML = "Waiting for the helper… once it's added, come back to this tab and your arrays appear automatically — no refresh needed.";
}
window.addEventListener("message", (e) => {
  // Only trust messages the bridge posts back into THIS page (same window + origin).
  // SO_CAPTURE_LANDED carries vendor creds/site lists, so a cross-origin frame must
  // never be able to spoof it — match the origin guard used in sandbox.js/vendor-sheet.js.
  if (e.source !== window || e.origin !== window.location.origin) return;
  const d = e.data; if (!d || typeof d !== "object") return;
  if (d.type === "SO_EXTENSION_PRESENT" || (d.type === "SO_STATUS_ACK" && d.ok)) {
    if (!EXT_PRESENT) { EXT_PRESENT = true; if (step === 1) render(); }   // reveal the one-click path
  }
  if (d.type === "SO_CAPTURE_LANDED" && d.provider === "solaredge") onSolarEdgeCapture(d);
  if (d.type === "SO_CAPTURE_LANDED" && d.provider === "fronius") onReadingsCapture(d, "fronius", "Fronius Solar.web");
  if (d.type === "SO_CAPTURE_LANDED" && d.provider === "sma") onReadingsCapture(d, "sma", "SMA Sunny Portal");
  if (d.type === "SO_CAPTURE_LANDED" && d.provider === "chint") onReadingsCapture(d, "chint", "Chint Connect");
  if (d.type === "SO_CAPTURE_FAILED") onCaptureFailed(d);
  // SO_SYNC_ALL_DONE fires the instant the extension OPENS the portal tabs — not
  // when captures land (those stream in over the next 10–90s). So we only settle
  // early if the sync FAILED to start; otherwise captures drive the screen and an
  // all-resolved/timeout settles it.
  if (d.type === "SO_SYNC_ALL_DONE" && d.ok === false) finishSyncAll();
});
// The bridge announces at document_start (before this runs), so ask explicitly too.
extSend("SO_STATUS_REQUEST");

// Readings-capture vendors (Fronius, SMA): the extension ships the READINGS
// themselves (no API key — their official APIs are paid/high-friction), so unlike
// SolarEdge we don't call /public/preview. We render the captured systems, stash
// the raw capture, and POST it to /v1/array-owners/inverter-capture after signup.
function onReadingsCapture(d, vendor, label){
  if (state.syncingAll){ onSyncCapture(vendor, label, Array.isArray(d.sites)?d.sites:[], "readings"); return; }
  state.vendor = vendor;
  const scan = document.getElementById("scanArea");
  const caps = Array.isArray(d.sites) ? d.sites : [];
  if (!caps.length){
    if (scan) scan.innerHTML = `<div class="helper" style="color:var(--warn)">We reached ${label} but couldn't read your systems yet — make sure you're signed in there, then click again.</div>`;
    return;
  }
  if (scan) scan.innerHTML = `<div class="scan"><span class="ring"></span> Got your ${label} account — reading your inverters…</div>`;
  state.readingsCapture = { provider: vendor, sites: caps };
  let totalKw = 0;
  state.sites = caps.map(s=>{
    const kw = Number(s.peak_power_kw)||0; totalKw += kw;
    return { site_id: s.site_id, name: s.name, peak_power_kw: kw, vendor: label.split(" ")[0],
             inverter_count: (s.inverters||[]).length || s.inverter_count || null };
  });
  state.realSites = true;
  state.totals = totalKw>0 ? { peak_power_kw: Math.round(totalKw*10)/10, annual_value_usd: 0 } : null;
  go(2);
}

// A readings-capture vendor gave up (e.g. not signed in, or — for Chint — the
// extraction endpoints aren't grounded yet). Resolve the spinner with the real
// reason instead of leaving it spinning.
function onCaptureFailed(d){
  if (d && d.provider === "chint" && _chintTimer){ clearTimeout(_chintTimer); _chintTimer = null; }
  if (state.syncingAll){
    const v = d && d.provider;
    if (v && (!state.syncStatus[v] || state.syncStatus[v].state !== "found")) state.syncStatus[v] = { state:"none" };
    renderSyncStatus();
    maybeSettleSoon();
    return;
  }
  const scan = document.getElementById("scanArea");
  const label = ({solaredge:"SolarEdge",fronius:"Fronius Solar.web",sma:"SMA Sunny Portal",chint:"Chint Connect"})[d && d.provider] || (d && d.provider) || "the portal";
  if (scan) scan.innerHTML = `<div class="helper" style="color:var(--warn)">${label} didn't connect: ${(d && d.reason)||"unknown error"}. Make sure you're signed in on the portal tab, then click the login button again.</div>`;
}

// ── Sync-all orchestration ──────────────────────────────────────────────────
// One click → SO_SYNC_ALL fans the extension out across every vendor at once.
// Each vendor's capture lands here, ACCUMULATES (deduped) into state.sites, and
// streams into the "Your arrays" screen live. SO_SYNC_ALL_DONE (or a timeout)
// settles it.
function startSyncAll(){
  if (!EXT_PRESENT) return;
  state.syncMode = true;
  state.syncingAll = true;
  state.captures = {};
  state.sites = [];
  state.realSites = true;
  state.totals = null;
  state.syncStatus = {};
  SYNC_ALL_VENDORS.forEach(v => state.syncStatus[v] = { state:"checking" });
  go(2);                                       // arraysScreen renders the live sync
  extSend("SO_SYNC_ALL", { vendors: SYNC_ALL_VENDORS });
  if (_syncAllTimer) clearTimeout(_syncAllTimer);
  _syncAllTimer = setTimeout(finishSyncAll, 90000);   // honest stop if a platform never answers
}

// Readings vendors (Fronius/SMA/Chint) land their sites directly; merge + keep
// the raw payload so finish() can persist it after signup.
function onSyncCapture(vendor, label, caps, kind){
  const brand = SYNC_ALL_LABEL[vendor] || (label||"").split(" ")[0] || vendor;
  if (caps && caps.length){
    const mapped = caps.map(s => ({
      site_id: s.site_id, name: s.name,
      peak_power_kw: Number(s.peak_power_kw)||0,
      vendor: brand,
      inverter_count: (s.inverters||[]).length || s.inverter_count || null,
      annual_value_usd: Number(s.annual_value_usd)||0
    }));
    const added = mergeSites(mapped, brand);
    if (kind === "readings") state.captures[vendor] = { provider: vendor, sites: caps };
    state.syncStatus[vendor] = { state:"found", count: state.sites.filter(s => s.vendor === brand).length };
    if (added) appendArrayChips();
  } else if (!state.syncStatus[vendor] || state.syncStatus[vendor].state !== "found"){
    state.syncStatus[vendor] = { state:"none" };
  }
  renderSyncStatus();
  maybeSettleSoon();
}

// SolarEdge lands a durable account key, not sites — fetch its preview to show
// the arrays, and stash the key for finish() to attach the whole account.
async function onSyncSolarEdge(d){
  if (d.apiKey){
    state.captures.solaredge = { apiKey: d.apiKey };
    try{
      const r = await fetch(`${API_BASE}/v1/array-owners/public/preview`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ vendor:"solaredge", config:{ api_key: d.apiKey } })
      });
      const pd = await r.json().catch(()=>({}));
      onSyncCapture("solaredge", "SolarEdge", Array.isArray(pd.sites)?pd.sites:[], "solaredge");
      return;
    }catch(e){}
  }
  if (Array.isArray(d.sites) && d.sites.length){ onSyncCapture("solaredge","SolarEdge", d.sites, "solaredge"); return; }
  if (!state.syncStatus.solaredge || state.syncStatus.solaredge.state !== "found") state.syncStatus.solaredge = { state:"none" };
  renderSyncStatus();
  maybeSettleSoon();
}

// Once every platform has reported in (found or explicitly empty), settle a beat
// later — no need to hold the full timeout when there's clearly nothing more coming.
function maybeSettleSoon(){
  const pending = SYNC_ALL_VENDORS.some(v => !state.syncStatus[v] || state.syncStatus[v].state === "checking");
  if (!pending){
    if (_settleTimer) clearTimeout(_settleTimer);
    _settleTimer = setTimeout(finishSyncAll, 2500);   // grace for a last straggler
  }
}

function finishSyncAll(){
  if (!state.syncingAll) return;
  state.syncingAll = false;
  if (_syncAllTimer){ clearTimeout(_syncAllTimer); _syncAllTimer = null; }
  if (_settleTimer){ clearTimeout(_settleTimer); _settleTimer = null; }
  SYNC_ALL_VENDORS.forEach(v => { if (state.syncStatus[v] && state.syncStatus[v].state === "checking") state.syncStatus[v] = { state:"none" }; });
  let kw = 0; state.sites.forEach(s => kw += s.peak_power_kw||0);
  state.totals = kw>0 ? { peak_power_kw: Math.round(kw*10)/10, annual_value_usd: 0 } : null;
  if (step === 2) render();    // re-render arraysScreen in its settled state
}

// Per-vendor status chips above the cascading arrays.
function renderSyncStatus(){
  const bar = document.getElementById("syncStatus");
  if (!bar) return;
  bar.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin:1rem 0";
  bar.innerHTML = SYNC_ALL_VENDORS.map(v => {
    const st = state.syncStatus[v] || { state:"checking" };
    let icon, txt, col;
    if (st.state === "found"){ icon="✓"; txt = st.count + (st.count===1?" array":" arrays"); col="var(--good,#16a34a)"; }
    else if (st.state === "none"){ icon="·"; txt="none"; col="var(--faint,#94a3b8)"; }
    else { icon="◌"; txt="checking…"; col="var(--ink2,#64748b)"; }
    return `<span style="display:flex;align-items:center;gap:8px;background:var(--card,#f4f7fb);border-radius:10px;padding:9px 11px;font-size:12.5px"><b style="color:${col}">${icon}</b> ${SYNC_ALL_LABEL[v]} <span style="margin-left:auto;color:var(--faint,#94a3b8)">${txt}</span></span>`;
  }).join("");
}

// Append only the arrays not yet on screen (idempotent), then refresh the tally
// + reveal the email field.
function appendArrayChips(){
  const wrap = document.getElementById("arrays");
  if (!wrap) return;
  const start = wrap.childElementCount;
  state.sites.slice(start).forEach((s,i) => {
    const el = document.createElement("div");
    el.className = "achip";
    el.style.animationDelay = (i*0.12)+"s";
    const kw = (s.peak_power_kw||0) > 0 ? `${(s.peak_power_kw||0).toFixed(1)} kW` : "";
    const val = kw ? `<span class="kw">${kw}</span>` : "";
    const meta = [s.vendor, "site "+s.site_id].filter(Boolean).join(" · ");
    el.innerHTML = `<span class="dot"></span><div><div class="nm">${(s.name||("Site "+s.site_id))}</div><div class="me">${meta}</div></div>${val}<span class="ck">✓</span>`;
    wrap.appendChild(el);
  });
  const tally = document.getElementById("tally");
  if (tally){
    let kw = 0; state.sites.forEach(s => kw += s.peak_power_kw||0);
    const plats = new Set(state.sites.map(s => s.vendor).filter(Boolean)).size;
    const more = state.syncingAll ? " so far…" : ".";
    tally.innerHTML = state.sites.length
      ? `<b>${state.sites.length} ${state.sites.length===1?"array":"arrays"}</b>${kw>0?` · <b>${kw.toFixed(1)} kW</b>`:""} across <b>${plats} ${plats===1?"platform":"platforms"}</b>${more}`
      : "";
  }
  const em = document.getElementById("emailFld"); if (em && state.sites.length) em.style.display = "";
  syncClaim();
}

function syncBackToConnect(){
  state.syncingAll = false; state.syncMode = false;

}

// Vendor-aware pre-signup preview. EVERY available vendor now hits the public
// /preview endpoint so the owner sees their REAL site(s) + value before signup:
//  - SolarEdge / Locus(+partner) → list the whole account/partner
//  - Locus(no partner) / Fronius / SMA → preview the one named system
// Falls back to the demo cascade only when the backend is unreachable.
async function connectVendor(){
  const v = vendorByCode(state.vendor);
  const scan = document.getElementById("scanArea");
  const btn = document.getElementById("discoverBtn");
  btn.disabled = true;
  const verb = v.discover ? `Reaching your ${v.label} account…` : `Checking your ${v.label} system…`;
  scan.innerHTML = `<div class="scan"><span class="ring"></span> ${verb}</div>`;

  // Build the per-vendor config from the fields the connect form collected.
  const config = {};
  (v.fields||[]).forEach(f=>{
    const val = (f.name==="apiKey") ? state.apiKey : (state.fields[f.name]||"");
    if(val) config[f.name==="apiKey" ? "api_key" : f.name] = val.trim();
  });

  let sites = [];
  state.realSites = false;
  state.totals = null;
  try{
    const res = await fetch(`${API_BASE}/v1/array-owners/public/preview`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ vendor: state.vendor, config })
    });
    const data = await res.json().catch(()=>({}));
    if(res.status===429){
      scan.innerHTML = `<div class="helper" style="color:var(--warn)">${data.detail||"Too many attempts — give it a minute and try again."}</div>`;
      btn.disabled=false; return;
    }
    if(res.ok && data.ok && Array.isArray(data.sites) && data.sites.length){
      // Their actual array(s) — the sublime moment.
      sites = data.sites.map(s=>({...s, vendor: v.label}));
      state.realSites = true;
      state.totals = data.totals || null;
    } else if(res.ok && data.ok===false && data.message){
      // Friendly, actionable rejection (bad creds, scope, empty account).
      scan.innerHTML = `<div class="helper" style="color:var(--warn)">${data.message}</div>`;
      btn.disabled=false; return;
    } else {
      // Unexpected/empty — fall through to the demo cascade so the flow still
      // reaches account creation; the real creds are attached after sign-in.
      sites = demoSites();
    }
  }catch(e){
    // CORS/network/offline — graceful: show the propagation with sample data.
    sites = demoSites();
  }
  state.sites = sites;
  go(2);
}

// Animate a dollar figure from 0 → target over `ms` (eased), tabular $.
function countUp(el, target, ms){
  if(!el) return;
  const start = performance.now();
  const fmt = n => "$"+Math.round(n).toLocaleString();
  function tick(now){
    const t = Math.min((now-start)/ms, 1);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = fmt(target*eased);
    if(t<1) requestAnimationFrame(tick);
    else el.textContent = fmt(target);
  }
  requestAnimationFrame(tick);
}

// Create the trialing Array Operator account, then mint a session so we can
// offer the add-card step inline. The trial is identical to NEPOOL (14 days,
// no card). On any network/CORS failure we fail gracefully — nothing stored.
async function finish(){
  go(3);
  burst();
  const company = state.sites.length ? `${vendorByCode(state.vendor).label} owner` : null;
  // Name was removed from the funnel; derive a sane full_name from the email's
  // local part (backend requires >=2 chars). The owner can edit it later in
  // Master Account → Name.
  const derivedName = ((state.email||"").split("@")[0] || "Array owner")
    .replace(/[._-]+/g, " ").trim().replace(/\b\w/g, c => c.toUpperCase()) || "Array owner";
  try{
    const startRes = await fetch(`${API_BASE}/v1/onboarding/start`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        email: state.email.trim(),
        full_name: derivedName.length >= 2 ? derivedName : "Array owner",
        company,
        array_count: Math.max(state.sites.length, 1),
        product: "array_operator",
        consent_version: CONSENT_VERSION,
        ...(state.password ? { password: state.password } : {}),
      })
    });
    const startData = await startRes.json().catch(()=>({}));
    if(startRes.ok && startData.onboarding_token){
      state.onboardingToken = startData.onboarding_token;
      // Complete onboarding → marks done, emails magic link, mints a session.
      try{
        const compRes = await fetch(`${API_BASE}/v1/onboarding/complete?token=${encodeURIComponent(state.onboardingToken)}`, {
          method:"POST", headers:{"Content-Type":"application/json"}, body: "{}"
        });
        const compData = await compRes.json().catch(()=>({}));
        if(compRes.ok && compData.session_token){
          state.sessionToken = compData.session_token;
          // Same-origin with the dashboard (/accounts on arrayoperator.com), so
          // stash the freshly-minted session under the key the dashboard SPA
          // reads (so_session). The "Open my dashboard" CTA then lands them
          // already signed in — no email magic-link detour.
          try{ localStorage.setItem("so_session", compData.session_token); }catch(e){}
          if(state.gmpPath){ try{ localStorage.setItem("ao_pending_gmp_connect","1"); }catch(e){} }
        }
      }catch(e){ /* session is a bonus; magic-link email is the fallback */ }
      // Attach the real credential now using the freshly-minted session — so
      // their dashboard is populated the instant they sign in (no re-pasting).
      // SolarEdge/Locus attach the whole account; Fronius/SMA attach the one
      // system. Best-effort: a failure never blocks the trial.
      if(state.sessionToken && state.realSites){
        try{
          const v = vendorByCode(state.vendor);
          const hdr = {"Content-Type":"application/json","Authorization":`Bearer ${state.sessionToken}`};
          let conn, cd;
          if(state.syncMode){
            // Sync-all: persist EVERY captured vendor — SolarEdge by its account
            // key, readings vendors (Fronius/SMA/Chint) by their captured sites.
            let connectedAny = false;
            for(const vendor of Object.keys(state.captures||{})){
              const cap = state.captures[vendor]; if(!cap) continue;
              try{
                if(vendor==="solaredge" && cap.apiKey){
                  const r = await fetch(`${API_BASE}/v1/array-owners/solaredge/connect-account`, {
                    method:"POST", headers:hdr, body: JSON.stringify({api_key: cap.apiKey})
                  });
                  const cr = await r.json().catch(()=>({}));
                  if(r.ok && (cr.connected || cr.created || cr.matched)) connectedAny = true;
                } else if(cap.sites && cap.sites.length){
                  const r = await fetch(`${API_BASE}/v1/array-owners/inverter-capture`, {
                    method:"POST", headers:hdr, body: JSON.stringify({ provider: vendor, sites: cap.sites })
                  });
                  const cr = await r.json().catch(()=>({}));
                  const nInv = (typeof cr.inverters_persisted === "number")
                    ? cr.inverters_persisted
                    : ((cr.sites||[]).reduce((t,s)=>t+(s.inverters_persisted||0),0));
                  if(r.ok && cr.ok && cr.sites_captured && nInv>0) connectedAny = true;
                }
              }catch(e){ /* one vendor failing never blocks the rest */ }
            }
            state.arraysConnected = connectedAny;
          } else if(state.readingsCapture && (state.vendor==="fronius" || state.vendor==="sma" || state.vendor==="chint")){
            // Extension-captured readings (no key to attach) — ingest them so the
            // dashboard + sandbox comb populate the instant they sign in.
            conn = await fetch(`${API_BASE}/v1/array-owners/inverter-capture`, {
              method:"POST", headers:hdr, body: JSON.stringify(state.readingsCapture)
            });
            cd = await conn.json().catch(()=>({}));
            // Require ACTUAL inverters, not just a site — a CHINT capture can land
            // a site with 0 devices (busTypeDevices not loaded yet) and still 200;
            // counting that as "connected" claims arrays that never appear.
            const _nInv = (typeof cd.inverters_persisted === "number")
              ? cd.inverters_persisted
              : ((cd.sites||[]).reduce((t,s)=>t+(s.inverters_persisted||0),0));
            state.arraysConnected = !!(conn.ok && cd.ok && cd.sites_captured && _nInv > 0);
          } else if(state.vendor==="solaredge" && state.apiKey){
            conn = await fetch(`${API_BASE}/v1/array-owners/solaredge/connect-account`, {
              method:"POST", headers:hdr, body: JSON.stringify({api_key: state.apiKey})
            });
            cd = await conn.json().catch(()=>({}));
            state.arraysConnected = !!(conn.ok && (cd.connected || cd.created || cd.matched));
          } else if(state.vendor==="locus" && (state.fields.partner_id||"").trim()){
            conn = await fetch(`${API_BASE}/v1/array-owners/locus/connect-account`, {
              method:"POST", headers:hdr, body: JSON.stringify({
                client_id: state.fields.client_id, client_secret: state.fields.client_secret,
                username: state.fields.username, password: state.fields.password,
                partner_id: parseInt(state.fields.partner_id, 10)
              })
            });
            cd = await conn.json().catch(()=>({}));
            state.arraysConnected = !!(conn.ok && (cd.connected || cd.created || cd.matched));
          } else {
            // Single-system vendors (Fronius, SMA, Locus without a partner_id):
            // build the config from the collected fields and attach one array.
            const config = {};
            (v.fields||[]).forEach(f=>{
              const val = (f.name==="apiKey") ? state.apiKey : (state.fields[f.name]||"");
              if(val) config[f.name==="apiKey" ? "api_key" : f.name] = val.trim();
            });
            conn = await fetch(`${API_BASE}/v1/array-owners/connect-single`, {
              method:"POST", headers:hdr, body: JSON.stringify({vendor: state.vendor, config})
            });
            cd = await conn.json().catch(()=>({}));
            state.arraysConnected = !!(conn.ok && cd.ok && cd.array_id);
          }
        }catch(e){ /* will connect from dashboard if this didn't land */ }
      }
    } else if(startRes.status === 409){
      // Account already exists — no new trial to mint. Send a REAL sign-in
      // link via the public auth-request endpoint (always 200, never leaks
      // who's registered) so the "check your email" copy is actually true,
      // then route them to sign in.
      state.existing = true;
      state.onboardingToken = "exists";
      try{
        // Product-SCOPED: this is the Array Operator signup, so the sign-in link
        // must resolve the owner's AO account (and reactivate IT if deactivated),
        // never cross-leak to a NEPOOL account they may also own on this email.
        await fetch(`${API_BASE}/v1/auth/request`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ email: state.email.trim(), product: "array_operator" })
        });
      }catch(e){ /* link send is best-effort; copy still routes them to sign in */ }
    }
  }catch(e){ /* CORS/offline — doneScreen shows the graceful retry path */ }
  // Re-render the done screen now that we know whether the account was created.
  if(step===3) main.innerHTML = doneScreen();
}

// Open Stripe Checkout (setup mode) to save a card. Reuses the dashboard's
// /v1/account/add-payment-method endpoint with the session we just minted.
async function addCard(){
  const note = document.getElementById("cardNote");
  const btn = document.getElementById("addCardBtn");
  if(!state.sessionToken){
    if(note){ note.innerHTML = `Open your dashboard from the sign-in link we emailed to <b>${state.email}</b>, then add a card from Settings.`; }
    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = "Opening secure checkout…"; }
  try{
    const r = await fetch(`${API_BASE}/v1/account/add-payment-method`, {
      method:"POST", headers:{"Authorization":`Bearer ${state.sessionToken}`}
    });
    const d = await r.json().catch(()=>({}));
    if(r.ok && d.checkout_url){ window.location.href = d.checkout_url; return; }
    if(note){ note.innerHTML = `Couldn't open checkout right now — you can add a card anytime from your dashboard.`; note.style.color = "var(--warn)"; }
  }catch(e){
    if(note){ note.innerHTML = `Couldn't reach checkout from here — add a card later from your dashboard.`; note.style.color = "var(--warn)"; }
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "Add a card to stay on after the trial →"; }
  }
}

function burst(){
  const c = document.getElementById("confetti");
  const colors = ["#34d399","#10b981","#6ee7b7","#a7f3d0","#059669"];
  for(let i=0;i<80;i++){
    const p=document.createElement("div");
    p.className="cf";
    p.style.left=Math.random()*100+"vw";
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(2.5+Math.random()*2)+"s";
    p.style.animationDelay=(Math.random()*0.6)+"s";
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    c.appendChild(p);
    setTimeout(()=>p.remove(), 5200);
  }
}

function render(){
  if(step===0) main.innerHTML = welcomeScreen();
  else if(step===1){ main.innerHTML = connectScreen(); syncConnect(); }
  else if(step===2){ main.innerHTML = arraysScreen(); if(state.gmpPath){ syncClaim(); } else if(state.syncMode){ renderSyncStatus(); appendArrayChips(); syncClaim(); } else { cascadeArrays(); } }
  else if(step===3) main.innerHTML = doneScreen();
}

renderStepper(); render();
</script>
