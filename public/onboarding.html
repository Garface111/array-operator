<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up your arrays · Array Operator</title>
<!-- Per-tab auth session shim, MUST be the very first script so it patches the
 so_session localStorage routing before anything reads/writes it. See session-tabscope.js. -->
<script src="/session-tabscope.js?v=1"></script>
<!-- Day mode only, set the attribute BEFORE first paint so there's no flash. -->
<script>document.documentElement.setAttribute("data-theme","day");</script>
<link rel="icon" type="image/svg+xml" href="favicon-day.svg"><!-- day(blue) is the default skin -->
<style>
 /* ════════════════════════════════════════════════════════════════════════
 ARRAY OPERATOR, ONBOARDING · "SKY" theme (self-contained style island)
 Matches public/theme-sky.css: the alpine-solar photograph is the full-
 viewport world, and every surface is frosted liquid-glass floating in
 front of it, Plus Jakarta Sans, glass-squircle sheets, blue = action,
 green = confirmed. This page does NOT load theme-sky.css; the language is
 replicated inline. PRESERVED semantics: green=success/confirmed,
 amber=warning, red=hard error, the honest server-storage language. This
 is a restyle of MATERIAL only, no copy, flow, or JS logic changed.
 ════════════════════════════════════════════════════════════════════════ */

 /* Plus Jakarta Sans, self-hosted variable font (wght 200–800). CSP font-src
 is 'self', no external URL. Mirrors theme-sky.css. */
 @font-face{
 font-family:"Plus Jakarta Sans";
 src:url("fonts/PlusJakartaSans-latin.woff2") format("woff2");
 font-weight:200 800; font-style:normal; font-display:swap;
 unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
 }
 @font-face{
 font-family:"Plus Jakarta Sans";
 src:url("fonts/PlusJakartaSans-latin-ext.woff2") format("woff2");
 font-weight:200 800; font-style:normal; font-display:swap;
 unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
 }

 /* ── design tokens (Sky) ── */
 :root{
 /* the sky itself */
 --sky-top:#1E90E8; --sky-mid:#56B4F0; --sky-horizon:#BEE3FA;
 /* ink + surfaces */
 --ink:#0E1420; --muted:#4C596B; --faint:#6B7789;
 --line:rgba(20,60,120,.17);
 --card:#ffffff; --card2:#F4F9FF;
 /* brand: blue = action, green = confirmed */
 --good:#2196F3; /* primary action + links + focus + healthy */
 --good2:#1E90E8;
 --primary-deep:#1976D2;
 --green:#4CAF50; /* saturated success / confirm accent */
 --green-ink:#178A4E; /* readable green text on white/glass */
 /* status (semantics preserved) */
 --warn:#d97706; --gold:#d97706; --gold2:#b45309; --bad:#dc2626; --sky:#0891b2;
 /* liquid-glass material tiers (mirror theme-sky.css) */
 --glass-sheet:rgba(255,255,255,.60); /* the wizard card = the signature frost */
 --glass-card:rgba(255,255,255,.55); /* solid-tier cards inside the sheet (no blur) */
 --glass-edge:rgba(255,255,255,.5);
 --sheet-blur:blur(18px) saturate(1.7);
 /* soft blue-tinted shadows */
 --shadow-card:0 8px 30px rgba(20,60,120,.08);
 --shadow-sheet:0 18px 50px -12px rgba(20,60,120,.16);
 --shadow-float:0 24px 70px -18px rgba(15,50,110,.28);
 /* radii */
 --r-pill:999px; --r-btn:12px; --r-card:22px; --r-sheet:28px;
 color-scheme:light;
 }
 *{box-sizing:border-box;margin:0;padding:0}
 /* height:100% on BODY (plus overflow-x:hidden below) makes body a viewport-tall
 scroll container; body keeps its own min-height:100% so it fills short screens
 and FLOWS on tall ones → normal, reliable window scroll (the cloud "add logins"
 step is tall). The fixed sky world rides body::before and never scrolls. */
 html{scroll-behavior:smooth;height:100%;background:var(--sky-mid)}
 body{
 background:none; color:var(--ink); min-height:100%;
 font:15px/1.55 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
 -webkit-font-smoothing:antialiased; overflow-x:hidden; font-feature-settings:"cv11","ss01";
 }
 /* ── THE SKY WORLD: the photograph IS the page (fixed layer; content floats) ──
 A sky-gradient underlayer paints instantly while the plate streams in and
 stays the color fallback (image-set webp→jpg, self-hosted, CSP-safe). ── */
 body::before{
 content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
 background-image:
 url("img/sky/world-zo6-2560.jpg"),
 radial-gradient(120% 42% at 50% 104%, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 62%),
 linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-horizon) 100%);
 background-image:
 image-set(url("img/sky/world-zo6-2560.webp") type("image/webp"),
 url("img/sky/world-zo6-2560.jpg") type("image/jpeg")),
 radial-gradient(120% 42% at 50% 104%, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 62%),
 linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-horizon) 100%);
 background-size:cover, auto, auto;
 background-position:center 50%, center, center;
 background-repeat:no-repeat;
 }
 /* smaller/lighter plate for narrower viewports */
 @media(max-width:1600px){
 body::before{
 background-image:
 url("img/sky/world-zo6-2560.jpg"),
 radial-gradient(120% 42% at 50% 104%, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 62%),
 linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-horizon) 100%);
 background-image:
 image-set(url("img/sky/world-zo6-1600.webp") type("image/webp"),
 url("img/sky/world-zo6-2560.jpg") type("image/jpeg")),
 radial-gradient(120% 42% at 50% 104%, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 62%),
 linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-horizon) 100%);
 }
 }
 a{color:inherit}
 button,input,select,textarea{font-family:inherit}
 :focus-visible{outline:2px solid var(--good);outline-offset:2px}
 ::selection{background:rgba(33,150,243,.22)}
 .shell{max-width:42rem;margin:0 auto;display:flex;flex-direction:column;gap:2rem;padding:2rem 1.25rem 3rem}
 @media(min-width:640px){.shell{padding:2.5rem 1.25rem 4rem}}

 /* brand, sits directly on the sky world: white ink + soft crisping shadow */
 .topbar{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.2px;color:#fff;font-size:16px;
 text-shadow:0 1px 3px rgba(8,44,90,.35),0 2px 18px rgba(8,44,90,.42)}
 .logo{width:32px;height:32px;border-radius:9px;flex:none;display:block;
 box-shadow:0 6px 18px -4px rgba(20,60,120,.4)}
 .topbar small{display:block;font-size:11px;font-weight:600;color:rgba(255,255,255,.85);letter-spacing:.04em;margin-top:-2px;text-shadow:0 1px 2px rgba(8,44,90,.32)}

 /* stepper, active=solid blue · done=filled green · upcoming=glass */
 .stepper{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;list-style:none}
 .step{display:flex;align-items:center;gap:.5rem}
 .pill{display:flex;align-items:center;gap:.5rem;border-radius:999px;padding:.375rem .75rem;font-size:.875rem;font-weight:600;transition:.15s}
 .pill .n{display:flex;height:1.25rem;width:1.25rem;align-items:center;justify-content:center;border-radius:999px;font-size:.75rem;font-weight:700}
 .pill.todo{background:rgba(255,255,255,.5);color:#33415A;border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
 .pill.todo .n{background:rgba(20,60,120,.1);color:#33415A}
 .pill.active{background:var(--good);color:#fff;box-shadow:0 4px 14px -4px rgba(33,150,243,.6)} .pill.active .n{background:rgba(255,255,255,.28);color:#fff}
 .pill.done{background:rgba(76,175,80,.16);color:var(--green-ink);border:1px solid rgba(76,175,80,.35)} .pill.done .n{background:rgba(76,175,80,.22);color:var(--green-ink)}
 .pill .lbl{display:none} @media(min-width:640px){.pill .lbl{display:inline}}
 .seg{height:1px;width:1rem;background:rgba(255,255,255,.55)}

 /* the wizard sheet, signature frosted liquid-glass */
 .card{background:var(--glass-sheet);-webkit-backdrop-filter:var(--sheet-blur);backdrop-filter:var(--sheet-blur);
 border:1px solid var(--glass-edge);border-radius:var(--r-sheet);padding:2rem;box-shadow:var(--shadow-sheet)}
 @media(min-width:640px){.card{padding:2.25rem}}
 .card.animate{animation:sheet-in .5s cubic-bezier(.2,.8,.2,1) both}
 @keyframes sheet-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
 h1{font-size:1.95rem;line-height:1.2;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
 .lede{margin-top:.85rem;font-size:1rem;color:var(--muted);line-height:1.55}

 /* affirmative callout, soft green glass */
 .callout{margin-top:2rem;border:1px solid rgba(76,175,80,.32);background:rgba(76,175,80,.1);border-radius:16px;padding:1.25rem}
 .callout .t{font-size:.875rem;font-weight:700;color:var(--green-ink)}
 .callout .s{margin-top:.3rem;font-size:.78rem;color:#3f6b46;line-height:1.5}
 .feats{margin-top:1.5rem;display:grid;gap:.6rem}
 @media(min-width:640px){.feats{grid-template-columns:1fr 1fr}}
 .feat{display:flex;align-items:center;gap:.6rem;font-size:.875rem;color:var(--ink)}
 .feat .ck,.ck{display:flex;height:1.3rem;width:1.3rem;flex:none;align-items:center;justify-content:center;border-radius:999px;
 background:rgba(76,175,80,.16);color:var(--green-ink);font-size:.7rem;border:1px solid rgba(76,175,80,.34)}

 label.fld{display:block;margin-top:1.5rem}
 label.fld .lab{font-size:.875rem;font-weight:700;color:var(--ink)}
 label.fld .hint{font-size:.8rem;color:var(--muted);margin-top:.2rem}
 /* dense/legibility surfaces stay near-solid white for crispness (not glass) */
 input[type=text],input[type=email],input[type=password]{width:100%;margin-top:.55rem;padding:.7rem .85rem;background:#fff;
 border:1px solid var(--line);border-radius:var(--r-btn);font:inherit;color:var(--ink);transition:.15s}
 input::placeholder{color:var(--faint)}
 input:focus{outline:none;border-color:var(--good);box-shadow:0 0 0 3px rgba(33,150,243,.18)}
 .helper{margin-top:.7rem;font-size:.78rem;color:var(--muted);line-height:1.55}
 .helper a{color:var(--good);font-weight:600;text-decoration:underline;text-underline-offset:2px}
 .helper b{color:var(--ink);font-weight:600}

 .row{margin-top:2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
 .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:var(--r-btn);padding:.625rem 1.25rem;font-size:.875rem;font-weight:650;border:0;cursor:pointer;transition:transform .14s,box-shadow .14s,background .14s,filter .14s}
 .btn:disabled{opacity:.45;cursor:not-allowed}
 /* primary = solid action blue w/ subtle shine, white text, hover lift */
 .btn-primary{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 42%),var(--good);color:#fff;box-shadow:0 6px 18px -6px rgba(33,150,243,.55)}
 .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 9px 24px -7px rgba(33,150,243,.65)}
 /* secondary = translucent white glass pill */
 .btn-ghost{background:rgba(255,255,255,.7);color:var(--ink);border:1px solid rgba(255,255,255,.9);border-radius:var(--r-pill);box-shadow:0 2px 10px rgba(20,60,120,.07)}
 .btn-ghost:hover{background:rgba(255,255,255,.92);border-color:rgba(33,150,243,.45);color:var(--primary-deep)}
 .btn-lg{padding:.8rem 1.5rem;font-size:.95rem;font-weight:700}

 /* discovery / cascade */
 .scan{margin-top:1.5rem;display:flex;align-items:center;gap:.75rem;color:var(--muted);font-size:.9rem}
 .ring{height:1.4rem;width:1.4rem;border-radius:999px;border:2.5px solid rgba(33,150,243,.2);border-top-color:var(--good);animation:spin .8s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
 .arrays{margin-top:1.25rem;display:flex;flex-direction:column;gap:.6rem}
 .achip{display:flex;align-items:center;gap:.85rem;border:1px solid var(--glass-edge);background:var(--glass-card);border-radius:14px;padding:.8rem .95rem;
 box-shadow:var(--shadow-card);opacity:0;transform:translateY(8px);animation:chip-in .5s cubic-bezier(.2,.8,.2,1) forwards}
 @keyframes chip-in{to{opacity:1;transform:translateY(0)}}
 /* the "generating" array dot, alive green */
 .achip .dot{height:.6rem;width:.6rem;border-radius:999px;background:var(--green);box-shadow:0 0 0 4px rgba(76,175,80,.16),0 0 10px rgba(76,175,80,.5);flex:none}
 .achip .nm{font-weight:700;font-size:.9rem;color:var(--ink)}
 .achip .me{font-size:.78rem;color:var(--muted);margin-top:.1rem}
 .achip .kw{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--green-ink);font-variant-numeric:tabular-nums}
 .achip .ck{margin-left:.4rem;color:var(--green-ink)}
 .tally{margin-top:1.25rem;text-align:center;font-size:.9rem;color:var(--muted)}
 .tally b{color:var(--ink)}

 /* done */
 .center{display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;padding:1rem 0}
 .seal{height:4.5rem;width:4.5rem;border-radius:999px;display:grid;place-items:center;font-size:2rem;
 background:radial-gradient(circle at 38% 32%,#7ed08a,var(--green));box-shadow:0 0 0 8px rgba(76,175,80,.12),0 10px 30px rgba(76,175,80,.4)}
 .done-h{font-size:1.6rem;font-weight:720;letter-spacing:-.02em;color:var(--ink)}
 .done-s{max-width:26rem;color:var(--muted);font-size:.95rem;line-height:1.55}

 .hidden{display:none}
 /* confetti, sky + green + gold celebration */
 #confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
 .cf{position:absolute;width:9px;height:9px;border-radius:2px;top:-12px;animation:fall linear forwards}
 @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
 @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

 /* vendor selector, glass tiles (kept for parity) */
 .vendgrid{margin-top:1.5rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.6rem}
 .vend{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;text-align:left;cursor:pointer;
 border:1px solid var(--glass-edge);background:var(--glass-card);border-radius:14px;padding:.75rem .85rem;transition:.15s;position:relative}
 .vend:hover{border-color:rgba(33,150,243,.45)}
 .vend.sel{border-color:var(--good);background:rgba(33,150,243,.1);box-shadow:0 0 0 1px rgba(33,150,243,.25),0 8px 24px -16px rgba(33,150,243,.5)}
 .vend.soon{cursor:not-allowed;opacity:.55}
 .vend.soon:hover{border-color:var(--glass-edge)}
 .vend .vn{font-size:.85rem;font-weight:700;color:var(--ink);line-height:1.2}
 .vend .vmeta{font-size:.7rem;color:var(--muted)}
 .vend .vtag{position:absolute;top:.55rem;right:.6rem;font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
 border-radius:6px;padding:1px 6px;background:rgba(20,60,120,.08);color:var(--muted);border:1px solid var(--line)}
 .vend.sel .vrad{color:var(--good)}
 .vend .vrad{position:absolute;top:.55rem;right:.6rem;color:var(--faint);font-size:.85rem}
 .vendnote{margin-top:1.1rem;border:1px solid rgba(217,119,6,.3);background:rgba(217,119,6,.09);border-radius:12px;padding:.85rem 1rem;font-size:.78rem;color:var(--gold2);line-height:1.5}
 .vendnote b{color:#8a4b09}

 /* value-reveal hero on the "your arrays" step, green value glass */
 .valuehero{margin-top:1.4rem;border:1px solid rgba(76,175,80,.32);border-radius:18px;padding:1.2rem 1.4rem;
 background:rgba(76,175,80,.1);position:relative;overflow:hidden}
 .valuehero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
 background:radial-gradient(circle at 40% 40%,rgba(76,175,80,.35),rgba(76,175,80,.06) 60%,transparent 72%);pointer-events:none}
 .vh-lab{color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.01em}
 .vh-big{font-size:2.7rem;font-weight:780;letter-spacing:-.02em;color:var(--green-ink);line-height:1.05;margin-top:.3rem;
 font-variant-numeric:tabular-nums}
 .vh-sub{color:var(--muted);font-size:.78rem;margin-top:.45rem;line-height:1.5}

 /* ── data-choice fork ("your data, your choice"), the two hero glass cards ── */
 .fork{margin-top:1.6rem;display:grid;gap:1rem}
 @media(min-width:640px){.fork{grid-template-columns:1fr 1fr}}
 .forkcard{position:relative;display:flex;flex-direction:column;gap:.5rem;text-align:left;cursor:pointer;font:inherit;color:var(--ink);
 border:1px solid var(--glass-edge);border-radius:18px;padding:1.5rem 1.4rem;background:var(--glass-card);box-shadow:var(--shadow-card);transition:transform .15s,box-shadow .15s,border-color .15s}
 .forkcard:hover,.forkcard:focus-visible{border-color:rgba(33,150,243,.55);box-shadow:0 0 0 1px rgba(33,150,243,.22),0 16px 34px -18px rgba(33,150,243,.5);transform:translateY(-2px);outline:none}
 .forkcard .fic{width:2.5rem;height:2.5rem;border-radius:13px;display:grid;place-items:center;font-size:1.25rem;
 background:rgba(33,150,243,.1);border:1px solid rgba(33,150,243,.22)}
 .forkcard .fh{font-size:1.1rem;font-weight:720;letter-spacing:-.01em}
 .forkcard .fs{font-size:.85rem;color:var(--muted);line-height:1.5}
 .forkcard .fs b,.forkcard .ftrade b{color:var(--ink);font-weight:650}
 .forkcard .ftrade{margin-top:.35rem;font-size:.75rem;color:var(--faint);line-height:1.45;border-top:1px dashed var(--line);padding-top:.6rem}
 .forkcard .fgo{margin-top:auto;padding-top:.5rem;font-size:.85rem;font-weight:700;color:var(--good)}
 .forkcard .fbadge{position:absolute;top:-.65rem;left:1.2rem;font-size:.6rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
 background:var(--green);color:#fff;border-radius:999px;padding:.22rem .6rem;box-shadow:0 6px 16px -4px rgba(76,175,80,.5)}
 .forkcard .fpill{align-self:flex-start;display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:700;color:var(--green-ink);
 background:rgba(76,175,80,.12);border:1px solid rgba(76,175,80,.3);border-radius:999px;padding:.15rem .55rem}

 /* ── cloud credential vault (server-side "store it with us" logins) —
 near-solid white for dense legibility, not glass ── */
 .cv-consent{display:flex;gap:.55rem;align-items:flex-start;margin-top:1.4rem;font-size:.8rem;color:var(--muted);line-height:1.5;cursor:pointer}
 .cv-consent input{width:auto;margin-top:.15rem;flex:0 0 auto;accent-color:var(--good)}
 .cv-consent a{color:var(--good);text-decoration:underline;text-underline-offset:2px}
 .cv-consent.flash{animation:cvflash 1.4s}
 @keyframes cvflash{0%,100%{color:var(--muted)}30%,70%{color:var(--bad)}}
 .cv-warn{margin-top:.9rem;border:1px solid rgba(217,119,6,.3);background:rgba(217,119,6,.09);border-radius:12px;padding:.75rem .9rem;font-size:.76rem;color:var(--gold);line-height:1.5}
 .cv-warn b{color:var(--ink)}
 .cv-group{margin-top:1.6rem}
 .cv-group-h{font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
 .cv-group-s{font-size:.78rem;color:var(--muted);margin-top:.15rem;line-height:1.45}
 .cv-portal{margin-top:.65rem;border:1px solid var(--line);border-radius:14px;padding:.85rem .95rem;background:rgba(255,255,255,.85)}
 .cv-portal-name{font-size:.88rem;font-weight:700;color:var(--ink)}
 .cv-row{margin-top:.6rem}
 .cv-row:first-of-type{margin-top:.4rem}
 .cv-row-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.3rem}
 .cv-badge{font-size:.66rem;font-weight:800;letter-spacing:.03em;border-radius:6px;padding:.1rem .45rem}
 .cv-badge.on{background:rgba(76,175,80,.16);color:var(--green-ink)}
 .cv-badge.off{background:rgba(148,163,184,.2);color:var(--faint)}
 .cv-switch{margin-left:auto;font-size:.72rem;color:var(--muted);display:inline-flex;align-items:center;gap:.3rem;cursor:pointer}
 .cv-switch input{accent-color:var(--good)}
 .cv-stat{font-size:.74rem;margin:.15rem 0 .35rem;font-weight:600}
 .cv-stat.ok{color:var(--green-ink)} .cv-stat.err{color:var(--warn)}
 .cv-dup-hint{font-size:.74rem;line-height:1.45;font-weight:600;color:#92400e;background:rgba(180,83,9,.08);
 border:1px solid rgba(180,83,9,.28);border-radius:9px;padding:.45rem .6rem;margin:.2rem 0 .4rem}
 .cv-dup-hint code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;font-weight:700;
 background:rgba(180,83,9,.12);padding:1px 5px;border-radius:4px}
 .cv-row.cv-row-dup{outline:1px solid rgba(180,83,9,.4);outline-offset:2px;border-radius:10px}
 .cv-user.cv-user-dup{border-color:#b45309 !important;box-shadow:0 0 0 2px rgba(180,83,9,.18)}
 .cv-fields{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
 .cv-fields input{margin-top:0;width:auto;flex:1 1 11rem;min-width:0}
 /* actions wrap to their own line so username + password get the full row width
 (no truncated placeholders) */

<body>
<div class="shell">
 <div class="topbar"><img class="logo" src="/favicon-day.svg" alt="" aria-hidden="true"><span>Array Operator<small>by EnergyAgent</small></span></div>
 <nav aria-label="Setup progress">

<div id="confetti"></div>

<script>
// On the live domain, arrayoperator.com proxies /v1/* to the shared Railway
// backend via _redirects, so we stay same-origin (API_BASE = ""). On a local
// static preview (localhost:8088) there's no proxy, so point straight at the
// Railway backend, its CORS allow-list already includes localhost:8088, so the
// real preview/onboarding calls work and you see YOUR real arrays, not the demo.
const API_BASE = /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname)
 ? "https://web-production-49c83.up.railway.app"
 : "";
const STEPS = ["Welcome", "Connect", "Your arrays", "Done"];
let step = 0;
// Bump when the Terms / Privacy / authorization language materially changes; the
// version a user accepted is persisted server-side at account creation for audit.
const CONSENT_VERSION = "2026-06-27";
let state = { name:"", email:"", password:"", vendor:"solaredge", apiKey:"", fields:{}, sites:[], onboardingToken:"", sessionToken:"", consent:false, syncingAll:false, captures:{}, syncStatus:{}, connect:"fork", cloudMode:false };
// ── "Find all my arrays", the one-click wow ────────────────────────────────
// After the extension is installed, one click fans it out across EVERY
// extension-login vendor at once. Captures ACCUMULATE (deduped) across vendors
// into state.sites instead of the last one winning, so the final count reflects
// every array on every platform. state.captures keeps each vendor's raw payload
// so finish() can persist them all after signup.
const SYNC_ALL_VENDORS = ["solaredge","fronius","sma","chint"];
const SYNC_ALL_LABEL = { solaredge:"SolarEdge", fronius:"Fronius", sma:"SMA", chint:"Chint" };
let _syncAllTimer = null, _settleTimer = null;
function _siteKey(s, label){ return String(s.site_id)+"|"+(label||s.vendor||""); }
function mergeSites(newSites, label){
 let added = 0;
 const have = new Set(state.sites.map(s => _siteKey(s)));
 (newSites||[]).forEach(s => {
 const k = _siteKey(s, label);
 if (!have.has(k)) { state.sites.push(Object.assign({}, s, label?{vendor:label}:{})); have.add(k); added++; }
 });
 return added;
}

// The required agree-to-terms + authorize-account-access gate shown at the email
// (account-creation) step. Themed via the same CSS vars as the rest of the flow.
function consentField(){
 return `<label class="fld" id="consentFld" style="display:flex;gap:.55rem;align-items:flex-start;margin-top:1.1rem;cursor:pointer">
 <input type="checkbox" id="consentChk" onchange="state.consent=this.checked;syncClaim()" ${state.consent?"checked":""} style="width:auto;margin-top:.15rem;flex:0 0 auto;accent-color:var(--good)">
 <span class="hint" style="margin-top:0">I agree to the <a href="/terms.html" target="_blank" rel="noopener" style="color:var(--good);text-decoration:underline">Terms of Service</a> and <a href="/privacy.html" target="_blank" rel="noopener" style="color:var(--good);text-decoration:underline">Privacy Policy</a>, and I authorize EnergyAgent to access the accounts I connect, on my behalf, to read my production and billing data.</span>
 </label>`;
}

// Inverter vendors, mirrors the backend registry order + metadata from
// api/inverters/ (VENDORS / vendor_catalog). SolarEdge is the only vendor with
// account-level multi-site discovery today; the rest connect per-array with
// their own credential fields. `discover:true` → uses the one-key cascade;
// otherwise we collect the vendor's fields and hand off to the dashboard's
// per-array connect (/v1/array-owners/arrays/{id}/inverter).
const VENDORS = [
 { code:"solaredge", label:"SolarEdge", meta:"One account key", available:true, discover:true,
 fields:[{name:"apiKey", label:"SolarEdge account API key", secret:true,
 hint:"The one key that unlocks every site on your account.",
 ph:"ABCD1234…", help:`Find it in your SolarEdge monitoring portal under <b>Admin → Site Access → API Access</b> (an <i>account</i>-level key, read-only). Don't have it handy? <a href="https://monitoring.solaredge.com" target="_blank" rel="noopener">Open the SolarEdge portal →</a>`}] },
 { code:"alsoenergy", label:"AlsoEnergy", meta:"PowerTrack · 1 login", available:true, discover:true,
 note:"One AlsoEnergy / PowerTrack login attaches every site on the account, same username & password you use at hmi.alsoenergy.com. Leave Site ID blank to connect them all.",
 fields:[
 {name:"username", label:"AlsoEnergy username (email)"},
 {name:"password", label:"AlsoEnergy password", secret:true},
 {name:"site_id", label:"Site ID (optional, leave blank for every site)", optional:true, hint:"Only if you want one site."},
 ] },
 { code:"enphase", label:"Enphase", meta:"Enlighten", available:false, discover:false,
 note:"Enphase connects through the Enlighten developer API, paste your Enphase app key + client ID/secret and your System ID. We're in final verification against live Enphase accounts, and a one-click owner sign-in is on the way.",
 fields:[
 {name:"api_key", label:"Enphase API key", secret:true,
 help:`From the <a href="https://developer-v4.enphase.com" target="_blank" rel="noopener">Enphase developer portal →</a> your app's <b>API key</b>.`},
 {name:"client_id", label:"App Client ID"},
 {name:"client_secret", label:"App Client Secret", secret:true},
 {name:"system_id", label:"System ID", hint:"Your Enlighten system ID."},
 ] },
 { code:"solis", label:"Solis", meta:"SolisCloud", available:false, discover:false,
 note:"Solis connects through the SolisCloud Platform API. In SolisCloud, open API Management and request an API key (KeyId + KeySecret), then paste them here. We're in final verification against live Solis accounts.",
 fields:[
 {name:"key_id", label:"SolisCloud KeyId"},
 {name:"key_secret", label:"SolisCloud KeySecret", secret:true},
 {name:"station_id", label:"Station ID (optional)"},
 ] },
 { code:"tigo", label:"Tigo", meta:"Energy Intelligence", available:false, discover:false,
 note:"Tigo connects with your Energy Intelligence (EI) login, the API needs a Premium data subscription on your Tigo account. We're in final verification against live Tigo accounts.",
 fields:[
 {name:"username", label:"Tigo EI username"},
 {name:"password", label:"Tigo EI password", secret:true},
 {name:"system_id", label:"System ID (optional)"},
 ] },
 { code:"locus", label:"Locus Energy", meta:"SolarNOC", available:true, discover:false,
 note:"Locus needs API credentials (client ID/secret + your SolarNOC login) from your Locus account manager. Enter them and we'll connect your sites.",
 fields:[
 {name:"client_id", label:"Client ID"},
 {name:"client_secret", label:"Client Secret", secret:true},
 {name:"username", label:"SolarNOC username"},
 {name:"password", label:"SolarNOC password", secret:true},
 {name:"partner_id", label:"Partner ID (optional, shows every site at once)"},
 ] },
 { code:"fronius", label:"Fronius", meta:"One account key", available:true, discover:false,
 note:"Paste your Solar.web REST API keys (Solar.web → Settings → REST API → CREATE NEW KEY) and we'll list every PV system on your account at once, same one-key connect as SolarEdge. US accounts: Fronius enables API access on request; the Query API is a paid Fronius service.",
 fields:[
 {name:"access_key_id", label:"Access Key ID"},
 {name:"access_key_value", label:"Access Key Value", secret:true},
 {name:"pv_system_id", label:"PV System ID (optional, leave blank to see every system)"},
 ] },
 { code:"sma", label:"SMA", meta:"Sunny Portal", available:true, discover:false,
 note:"One-click SMA API linking is coming, our SMA developer-app registration is in progress. Today you can connect instantly by signing into Sunny Portal (the EnergyAgent Chrome extension reads your inverters), or paste API credentials if SMA has issued them to you.",
 fields:[
 {name:"client_id", label:"Client ID"},
 {name:"client_secret", label:"Client Secret", secret:true},
 {name:"system_id", label:"Plant / System ID"},
 ] },
 { code:"chint", label:"Chint / CPS", meta:"Chint Connect", available:true, discover:false, loginOnly:true,
 note:"New, sign into the Chint Connect monitoring portal you already use and the EnergyAgent Chrome extension reads your inverters automatically (no key to paste). Chint/CPS support is in final verification against live accounts." },
];
function vendorByCode(c){ return VENDORS.find(v=>v.code===c) || VENDORS[0]; }

// Client-side email sanity check. Deliberately STRICTER than the loose /.+@.+\..+/
// we used to use, it rejects whitespace (e.g. "jane doe@farm.com") and consecutive
// dots ("foo@bar..com") so most addresses the backend's Pydantic EmailStr would 422
// on are caught here first, with a field-level hint, instead of dead-ending in a
// misleading "couldn't reach our servers". Not a full RFC validator (the backend is
// the billing basis), just enough to stop the obvious garbage.
function emailLooksValid(email){
 const e = String(email||"").trim();
 if(!e || /\s/.test(e)) return false; // no spaces anywhere
 if(/\.\./.test(e)) return false; // no consecutive dots
 const m = e.match(/^[^@]+@([^@]+)$/); // exactly one @, non-empty both sides
 if(!m) return false;
 const domain = m[1];
 if(domain.startsWith(".") || domain.endsWith(".")) return false;
 return /^[^.\s]+(\.[^.\s]+)+$/.test(domain); // domain has a dot-separated TLD, no empty labels
}

// ── Extension bridge: zero-key SolarEdge connect ──────────────────────────
// The EnergyAgent extension injects so_bridge.js on arrayoperator.com, which
// announces SO_EXTENSION_PRESENT and relays SO_CAPTURE_LANDED. When present we
// offer "Log in with SolarEdge", the owner signs into the portal they already
// use, the extension READS their durable account API key, and it lands here.
// We then run the SAME /public/preview reveal + connect flow as the paste path.
let EXT_PRESENT = false;
// The EnergyAgent helper on the Chrome Web Store (same extension NEPOOL Operator
// uses, it gains SolarEdge + arrayoperator.com support in v1.8.0).
const EXT_STORE_URL = "https://chromewebstore.google.com/detail/solar-operator-sync/ocohbimolfpnkjcjhiodopjjlhclinpl";
function extSend(type, extra){
 try { window.postMessage(Object.assign({ type, reqId: String(Date.now())+Math.random() }, extra||{}), "*"); } catch(e){}
}
function extInstallClicked(){
 const w = document.getElementById("extWatch");
 if (w) w.innerHTML = "Waiting for the Chrome extension… once it's added, come back to this tab and your arrays appear automatically, no refresh needed.";
 // A freshly-installed Chrome extension often lands SWITCHED OFF (Chrome disables a new/low-
 // reputation extension until the owner enables it). If nothing's announced after a beat, show
 // a calm, factual nudge so they aren't stranded at a grey toggle. Auto-resolves: render()
 // advances to the sync the instant the extension announces itself (EXT_PRESENT), replacing this.
 if (window._extEnableHintTimer) clearTimeout(window._extEnableHintTimer);
 window._extEnableHintTimer = setTimeout(() => {
 if (EXT_PRESENT) return; // it showed up, nothing to nudge
 const el = document.getElementById("extWatch");
 if (!el) return;
 el.innerHTML = `Added it but nothing here yet? Chrome sometimes installs a new extension <b>switched off</b>. Open the <b>Extensions</b> menu (the puzzle-piece icon, top-right of Chrome) &rarr; <b>Manage extensions</b>, or go to <b>chrome://extensions</b>, and turn <b>EnergyAgent</b> on. We start the moment it's enabled.`;
 }, 14000);
}
window.addEventListener("message", (e) => {
 // Only trust messages the bridge posts back into THIS page (same window + origin).
 // SO_CAPTURE_LANDED carries vendor creds/site lists, so a cross-origin frame must
 // never be able to spoof it, match the origin guard used in sandbox.js/vendor-sheet.js.
 if (e.source !== window || e.origin !== window.location.origin) return;
 const d = e.data; if (!d || typeof d !== "object") return;
 if (d.type === "SO_EXTENSION_PRESENT" || (d.type === "SO_STATUS_ACK" && d.ok)) {
 const was = EXT_PRESENT; EXT_PRESENT = true;
 // The FORK is the first thing, never yank someone out of it because the helper
 // happens to be installed. Only auto-sync once they've CHOSEN the on-device path.
 if (step === 1 && state.connect === "device" && !state.syncMode) startSyncAll();
 // If they're still on the fork, refresh it so the on-device card reads "installed".
 else if (!was && step === 1 && state.connect === "fork") render();
 }
 if (d.type === "SO_CAPTURE_LANDED" && d.provider === "solaredge") onSolarEdgeCapture(d);
 if (d.type === "SO_CAPTURE_LANDED" && d.provider === "fronius") onReadingsCapture(d, "fronius", "Fronius Solar.web");
 if (d.type === "SO_CAPTURE_LANDED" && d.provider === "sma") onReadingsCapture(d, "sma", "SMA Sunny Portal");
 if (d.type === "SO_CAPTURE_LANDED" && d.provider === "chint") onReadingsCapture(d, "chint", "Chint Connect");
 if (d.type === "SO_CAPTURE_FAILED") onCaptureFailed(d);
 // The extension tells us a portal needs a sign-in (no live session / no saved
 // password). During a sync, surface a one-click "Sign in to add" for that vendor.
 if (d.type === "SO_LOGIN_STATE") onSyncLoginState(d);
 // SO_SYNC_ALL_DONE fires the instant the extension OPENS the portal tabs, not
 // when captures land (those stream in over the next 10–90s). So we only settle
 // early if the sync FAILED to start; otherwise captures drive the screen and an
 // all-resolved/timeout settles it.
 if (d.type === "SO_SYNC_ALL_DONE" && d.ok === false) finishSyncAll();
});
// The bridge announces at document_start (before this runs), so ask explicitly too.
extSend("SO_STATUS_REQUEST");

function loginWithSolarEdge(){
 state.userConnect = true;
 const scan = document.getElementById("scanArea");
 if (scan) scan.innerHTML = `<div class="scan"><span class="ring"></span> Opening SolarEdge, sign in there and your arrays appear here automatically.</div>`;
 extSend("SO_OPEN_PORTAL", { url: "https://monitoring.solaredge.com/", active: true, provider: "solaredge" });
}

function onSolarEdgeCapture(d){
 if (state.syncMode){ onSyncSolarEdge(d); return; } // accept late captures too (corrects a settled false "none")
 if (!state.userConnect) return; // passive background capture, don't yank past the Connect screen / sync-all button
 state.vendor = "solaredge";
 const scan = document.getElementById("scanArea");
 if (d.apiKey){
 state.apiKey = d.apiKey;
 if (scan) scan.innerHTML = `<div class="scan"><span class="ring"></span> Got your SolarEdge account, pulling your arrays…</div>`;
 connectVendor(); // reuse the existing reveal with the captured key
 return;
 }
 // No durable key (rare), fall back to the site list if we got one, else prompt.
 if (Array.isArray(d.sites) && d.sites.length){
 state.sites = d.sites.map(s => ({ site_id: s.site_id, name: s.name, peak_power_kw: s.peak_power_kw, inverters: s.inverters || [] }));
 state.realSites = true; state.totals = null;
 go(2);
 return;
 }
 if (scan) scan.innerHTML = `<div class="helper" style="color:var(--warn)">We reached SolarEdge but couldn't read an API key automatically, paste your account key below and we'll take it from here.</div>`;
}

function loginWithFronius(){ openPortalLogin("fronius", "https://www.solarweb.com/", "Fronius Solar.web"); }
function loginWithSMA(){ openPortalLogin("sma", "https://ennexos.sunnyportal.com/", "SMA Sunny Portal"); }
// Chint/CPS is login-only (no key to paste). Capture works by reading the
// portal's own data; once the owner signs in, the extension walks every site
// automatically. Guard with a timeout so the spinner resolves if
// nothing lands.
let _chintTimer = null;
function loginWithChint(){
 // EXACT reuse of the dashboard's working "Open Chint to sync" (vendor-sheet.js openChint):
 // the ROOT portal URL + the plain SO_OPEN_PORTAL post, nothing else. openPortalLogin already
 // sends {url, active:true, provider:"chint"}, identical to the spreadsheet view that works.
 // (The #/pv/sites route + custom-routing detours were my own divergence and the bug.)
 openPortalLogin("chint", "https://monitor.chintpowersystems.com/", "Chint / CPS");
 if (_chintTimer) clearTimeout(_chintTimer);
 // In SYNC mode, never leave the tile spinning "signing in…" forever: if the capture hasn't
 // landed in ~75s (a generous window for the login + multi-site route walk), resolve it to a
 // one-click "Sign in to add Chint" so the owner always has a clear next action.
 if (state.syncMode){
 _chintTimer = setTimeout(() => {
 if (state.syncMode && state.syncStatus.chint && state.syncStatus.chint.state === "signing"){
 state.syncStatus.chint = { state:"needs_signin" };
 renderSyncStatus();
 maybeSettleSoon();
 }
 }, 75000);
 return;
 }
 _chintTimer = setTimeout(() => {
 const s = document.getElementById("scanArea");
 if (s && /Opening Chint/.test(s.innerHTML)) {
 s.innerHTML = `<div class="helper" style="color:var(--warn)">Didn't see your Chint inverters yet, make sure you're signed in at monitor.chintpowersystems.com, then try again. Finish setup and we'll bring them in the moment they're read.</div>`;
 }
 }, 120000);
}

function openPortalLogin(vendor, url, label){
 state.userConnect = true;
 const scan = document.getElementById("scanArea");
 if (scan) scan.innerHTML = `<div class="scan"><span class="ring"></span> Opening ${label}, sign in there and we'll bring you right back here.</div>`;
 // Dashboard Inverters shows a "Connecting…" card until fleet-tree has this vendor
 markPendingVendor(vendor, label || vendor, "portal open, waiting for capture");
 extSend("SO_OPEN_PORTAL", { url, active: true, provider: vendor });
}

// Array CAPACITY for the kW total. Vendors differ: SolarEdge/Locus/Fronius report a
// site peak_power_kw, but Chint device-only sites (and any vendor that doesn't) report
// none, so summing peak_power_kw alone UNDERCOUNTS (a "776.9 kW" total that silently
// ignored the SMA + Chint arrays, Bruce caught it). ROBUST fix: when the vendor gives
// no site peak, sum the ACTUAL inverter nameplates, the captured nameplate_kw
// (Fronius/SMA), or parsed from the inverter model for Chint (SCA50KTL=50, SC36KTL=36,
// mirroring the backend's _nameplate_from_model). No name-parsing.
const _CHINT_MODEL_KW = /SC[A-Z]{0,3}(\d{1,3}(?:\.\d+)?)KTL/i;
function invNameplateKw(iv){
 if(!iv) return 0;
 const n = Number(iv.nameplate_kw); if(n > 0) return n; // captured (Fronius / SMA)
 const m = String(iv.model || "").match(_CHINT_MODEL_KW); // Chint model → rated kW
 return m ? (parseFloat(m[1]) || 0) : 0;
}
function siteKw(s){
 const p = Number(s && s.peak_power_kw) || 0;
 if(p > 0) return p; // vendor-reported site peak
 return ((s && s.inverters) || []).reduce((t, iv) => t + invNameplateKw(iv), 0);
}

// Readings-capture vendors (Fronius, SMA): the extension ships the READINGS
// themselves (no API key, their official APIs are paid/high-friction), so unlike
// SolarEdge we don't call /public/preview. We render the captured systems, stash
// the raw capture, and POST it to /v1/array-owners/inverter-capture after signup.
function onReadingsCapture(d, vendor, label){
 if (state.syncMode){ onSyncCapture(vendor, label, Array.isArray(d.sites)?d.sites:[], "readings"); return; } // accept late captures too (corrects a settled false "none")
 if (!state.userConnect) return; // passive background capture, don't yank past the Connect screen / sync-all button
 state.vendor = vendor;
 const scan = document.getElementById("scanArea");
 const caps = Array.isArray(d.sites) ? d.sites : [];
 if (!caps.length){
 if (scan) scan.innerHTML = `<div class="helper" style="color:var(--warn)">We reached ${label} but couldn't read your systems yet, make sure you're signed in there, then click again.</div>`;
 return;
 }
 if (scan) scan.innerHTML = `<div class="scan"><span class="ring"></span> Got your ${label} account, reading your inverters…</div>`;
 state.readingsCapture = { provider: vendor, sites: caps };
 state.sites = caps.map(s=>{
 return { site_id: s.site_id, name: s.name, peak_power_kw: Number(s.peak_power_kw)||0, vendor: label.split(" ")[0],
 inverters: s.inverters || [], // kept so siteKw() can sum the real nameplates when no site peak
 inverter_count: (s.inverters||[]).length || s.inverter_count || null };
 });
 state.realSites = true;
 const totalKw = state.sites.reduce((t,s)=>t+siteKw(s),0); // peak_power_kw, else the size in the name (SMA/Chint report none)
 state.totals = totalKw>0 ? { peak_power_kw: Math.round(totalKw*10)/10, annual_value_usd: 0 } : null;
 go(2);
}

// A readings-capture vendor gave up (e.g. not signed in, or, for Chint, the
// extraction endpoints aren't grounded yet). Resolve the spinner with the real
// reason instead of leaving it spinning.
function onCaptureFailed(d){
 if (d && d.provider === "chint" && _chintTimer){ clearTimeout(_chintTimer); _chintTimer = null; }
 if (state.syncingAll){
 const v = d && d.provider;
 if (v && (!state.syncStatus[v] || state.syncStatus[v].state !== "found")) state.syncStatus[v] = { state:"none" };
 renderSyncStatus();
 maybeSettleSoon();
 return;
 }
 const scan = document.getElementById("scanArea");
 const label = ({solaredge:"SolarEdge",fronius:"Fronius Solar.web",sma:"SMA Sunny Portal",chint:"Chint Connect"})[d && d.provider] || (d && d.provider) || "the portal";
 if (scan) scan.innerHTML = `<div class="helper" style="color:var(--warn)">${label} didn't connect: ${(d && d.reason)||"unknown error"}. Make sure you're signed in on the portal tab, then click the login button again.</div>`;
}

// ── Sync-all orchestration ──────────────────────────────────────────────────
// One click → SO_SYNC_ALL fans the extension out across every vendor at once.
// Each vendor's capture lands here, ACCUMULATES (deduped) into state.sites, and
// streams into the "Your arrays" screen live. SO_SYNC_ALL_DONE (or a timeout)
// settles it.
function startSyncAll(){
 if (!EXT_PRESENT) return;
 state.syncMode = true;
 state.syncingAll = true;
 state.captures = {};
 state.sites = [];
 state.realSites = true;
 state.totals = null;
 state.syncStatus = {};
 SYNC_ALL_VENDORS.forEach(v => state.syncStatus[v] = { state:"checking" });
 go(2); // arraysScreen renders the live sync
 extSend("SO_SYNC_ALL", { vendors: SYNC_ALL_VENDORS });
 // Chint can't ride the silent background-tab path (its app only renders in a VISIBLE tab), so
 // its connect is a FOREGROUND open of monitor.chintpowersystems.com (the walk captures on the
 // existing login, then so_return_tab brings the owner back). CRITICAL: open it SOLO, only once
 // the fast vendors have settled, NOT concurrently. Firing it at 900ms while SolarEdge/Fronius/
 // SMA were all mid-SSO-login made the extension misread Chint's half-loaded page as logged-out
 // (a FALSE login_required ~200ms after open) and the capture never fired → eternal "signing in".
 // A solo open is exactly the dashboard's working "Open Chint to sync". maybeStartChint() fires
 // it as the fast vendors finish; this fallback opens it anyway if a slow vendor stalls.
 state._chintStarted = false;
 setTimeout(() => {
 if (state.syncMode && !state._chintStarted && state.syncStatus.chint && state.syncStatus.chint.state === "checking") {
 state._chintStarted = true; syncSignIn("chint");
 }
 }, 12000);
 if (_syncAllTimer) clearTimeout(_syncAllTimer);
 _syncAllTimer = setTimeout(finishSyncAll, 190000); // honest stop, Chint's login + per-site route walk can run ~3min; fast vendors land in seconds
}

// Open Chint's connect SOLO, the moment the fast portal vendors (everything but Chint) have each
// reached a terminal state, found / none / needs-sign-in. Gives Chint the clean, uncontended
// foreground open its SPA needs (the concurrent open tripped a false logged-out read). Idempotent.
function maybeStartChint(){
 if (!state.syncMode || state._chintStarted) return;
 const cs = state.syncStatus.chint;
 if (!cs || cs.state !== "checking") return;
 const fastSettled = SYNC_ALL_VENDORS.filter(v => v !== "chint").every(v => {
 const s = state.syncStatus[v];
 return s && (s.state === "found" || s.state === "none" || s.state === "needs_signin");
 });
 if (!fastSettled) return;
 state._chintStarted = true;
 syncSignIn("chint");
}

// Readings vendors (Fronius/SMA/Chint) land their sites directly; merge + keep
// the raw payload so finish() can persist it after signup.
function onSyncCapture(vendor, label, caps, kind){
 const brand = SYNC_ALL_LABEL[vendor] || (label||"").split(" ")[0] || vendor;
 if (caps && caps.length){
 const mapped = caps.map(s => ({
 site_id: s.site_id, name: s.name,
 peak_power_kw: Number(s.peak_power_kw)||0,
 vendor: brand,
 inverters: s.inverters || [], // kept so siteKw() can sum the real nameplates when no site peak
 inverter_count: (s.inverters||[]).length || s.inverter_count || null,
 annual_value_usd: Number(s.annual_value_usd)||0
 }));
 const added = mergeSites(mapped, brand);
 if (kind === "readings") state.captures[vendor] = { provider: vendor, sites: caps };
 state.syncStatus[vendor] = { state:"found", count: state.sites.filter(s => s.vendor === brand).length };
 if (added) appendArrayChips();
 } else if (!state.syncStatus[vendor] || state.syncStatus[vendor].state !== "found"){
 state.syncStatus[vendor] = { state:"none" };
 }
 renderSyncStatus();
 maybeStartChint(); // a fast vendor just settled → Chint may now open solo
 maybeSettleSoon();
}

// SolarEdge lands a durable account key, not sites, fetch its preview to show
// the arrays, and stash the key for finish() to attach the whole account.
async function onSyncSolarEdge(d){
 if (d.apiKey){
 state.captures.solaredge = { apiKey: d.apiKey };
 try{
 const r = await fetch(`${API_BASE}/v1/array-owners/public/preview`, {
 method:"POST", headers:{"Content-Type":"application/json"},
 body: JSON.stringify({ vendor:"solaredge", config:{ api_key: d.apiKey } })
 });
 const pd = await r.json().catch(()=>({}));
 onSyncCapture("solaredge", "SolarEdge", Array.isArray(pd.sites)?pd.sites:[], "solaredge");
 return;
 }catch(e){}
 }
 if (Array.isArray(d.sites) && d.sites.length){ onSyncCapture("solaredge","SolarEdge", d.sites, "solaredge"); return; }
 if (!state.syncStatus.solaredge || state.syncStatus.solaredge.state !== "found") state.syncStatus.solaredge = { state:"none" };
 renderSyncStatus();
 maybeStartChint();
 maybeSettleSoon();
}

// Once every platform has reported in (found or explicitly empty), settle a beat
// later, no need to hold the full timeout when there's clearly nothing more coming.
function maybeSettleSoon(){
 const pending = SYNC_ALL_VENDORS.some(v => { const s = state.syncStatus[v]; return !s || s.state === "checking" || s.state === "signing"; });
 if (!pending){
 if (_settleTimer) clearTimeout(_settleTimer);
 _settleTimer = setTimeout(finishSyncAll, 2500); // grace for a last straggler
 }
}

function finishSyncAll(){
 if (!state.syncingAll) return;
 state.syncingAll = false;
 if (_syncAllTimer){ clearTimeout(_syncAllTimer); _syncAllTimer = null; }
 if (_settleTimer){ clearTimeout(_settleTimer); _settleTimer = null; }
 // Anything that didn't capture (no live session, or a sign-in that never landed) → offer a
 // one-click sign-in, not a dead "none" or an eternal "signing in…".
 SYNC_ALL_VENDORS.forEach(v => { const s = state.syncStatus[v]; if (!s || s.state === "checking" || s.state === "none" || s.state === "signing") state.syncStatus[v] = { state:"needs_signin" }; });
 let kw = 0; state.sites.forEach(s => kw += siteKw(s)); // peak, else the size labeled in the name (SMA/Chint report no peak)
 state.totals = kw>0 ? { peak_power_kw: Math.round(kw*10)/10, annual_value_usd: 0 } : null;

}

// The three password-portal inverter vendors the harvester signs into (SolarEdge
// uses an API key, not a stored password, so it stays on its own API path, not
// offered here). Mirrors sandbox.js AR_INVERTERS.
const CLOUD_INVERTERS = [
 { id:"fronius", label:"Fronius (Solar.web)", ph:"Solar.web username / email" },
 { id:"sma", label:"SMA (Sunny Portal)", ph:"Sunny Portal username / email" },
 { id:"chint", label:"Chint / CPS", ph:"Chint username / email" },
];
const CLOUD_INV_IDS = new Set(CLOUD_INVERTERS.map(v=>v.id));
let _cloudCatalog = null;
let _cloudAddedUtils = []; // utility codes picked this session (show an empty card to fill)

// cloudApi mirrors sandbox.js cloudOp, but authed with the freshly-minted onboarding
// session (state.sessionToken) instead of the dashboard's authHeaders().
async function cloudApi(op, extra){
 const tok = state.sessionToken;
 if(!tok) return { ok:false, error:"signin" };
 const H = { "Content-Type":"application/json", "Authorization":"Bearer "+tok };
 try{
 if(op==="status"){
 const r = await fetch(`${API_BASE}/v1/cloud-capture/status`, { headers:{ "Authorization":"Bearer "+tok } });
 if(!r.ok) return { ok:false, error:"http_"+r.status };
 return Object.assign({ ok:true }, await r.json());
 }
 if(op==="set"){
 const r = await fetch(`${API_BASE}/v1/cloud-capture/credentials`, { method:"POST", headers:H, body:JSON.stringify({
 provider: extra.provider, username: extra.username, password: extra.password,
 login_host: extra.login_host || null, enable: true, consent: extra.consent === true }) });
 const d = await r.json().catch(()=>({}));
 return { ok:r.ok, error: r.ok ? null : (typeof d.detail === "string" ? d.detail : "http_"+r.status) };
 }
 if(op==="clear"){
 const r = await fetch(`${API_BASE}/v1/cloud-capture/credentials`, { method:"DELETE", headers:H, body:JSON.stringify({ provider: extra.provider, username: extra.username }) });
 return { ok:r.ok };
 }
 if(op==="toggle"){
 const r = await fetch(`${API_BASE}/v1/cloud-capture/toggle`, { method:"POST", headers:H, body:JSON.stringify({ provider: extra.provider, username: extra.username, enable: extra.enable }) });
 return { ok:r.ok };
 }
 }catch(e){ return { ok:false, error:String(e) }; }
 return { ok:false, error:"bad_op" };
}

async function loadCloudCatalog(){
 if(_cloudCatalog) return _cloudCatalog;

 try{
 const r = await fetch(`${API_BASE}/v1/providers`, { credentials:"same-origin" });

 (j && j.providers || []).forEach(p => { if(p && p.code && p.scrape_status==="live"){ map[p.code] = { label: p.label||p.code, host: p.smarthub_host||"", state: p.state||"" }; } });
 }catch(e){ /* offline, fall back to code-derived labels */ }
 if(!map.gmp) map.gmp = { label:"Green Mountain Power" };
 _cloudCatalog = map; return map;
}
function cloudUtilLabel(code, catalog){
 const c = catalog && catalog[code];
 if(c && c.label) return c.label + (c.host ? " (SmartHub)" : "");
 if(code==="gmp") return "Green Mountain Power";
 if(/^sh_/.test(code)) return code.replace(/^sh_/,"").replace(/[-_]/g," ").toUpperCase()+" (SmartHub)";
 return code.toUpperCase();
}
// Adapt the cloud /status payload → the shape credRow renders from (mirrors
// sandbox.js cloudStatusToShape). 2nd+ logins for a provider slot under code::user.
function cloudShape(cs){
 const shape = {}; const seen = {};
 (cs.credentials||[]).forEach(c => {
 const code = (c.provider||"").toLowerCase();
 const isInv = CLOUD_INV_IDS.has(code);
 const uKey = (c.username||"").toLowerCase();
 const slot = seen[code] ? (code+"::"+uKey) : code; seen[code]=true;
 shape[slot] = { hasCreds:true, enabled:c.enabled!==false, username:c.username||"", utility:!isInv, inverter:isInv, code:code, host:c.login_host||"", ok:c.last_harvest_ok, at:c.last_harvest_at, fails:c.harvest_fails||0 };
 });
 return shape;
}

 const credRow = (opts) => {
 const { key, saveCode, ph, hasCreds, enabled, prefillUser, addLabel, stat } = opts;
 const on = hasCreds && enabled;
 let statLine = "";
 if(hasCreds){
 const s = stat || {};
 if((s.fails||0) >= 3) statLine = `<div class="cv-stat err">⚠ Paused, re-enter your password to retry</div>`;
 else if(s.at && s.ok===false) statLine = `<div class="cv-stat err">⚠ Couldn't sign in, check the password</div>`;
 else if(s.at) statLine = `<div class="cv-stat ok">✓ Connected, refreshing automatically</div>`;
 else statLine = `<div class="cv-stat ok">✓ Saved, first refresh starting…</div>`;
 }
 const userVal = prefillUser ? ` value="${esc(prefillUser)}"` : "";
 const origUser = hasCreds && prefillUser ? ` data-origuser="${esc((prefillUser||"").trim().toLowerCase())}"` : "";
 return `<div class="cv-row" data-key="${esc(key)}" data-savecode="${esc(saveCode)}" data-hascreds="${hasCreds?"1":"0"}"${origUser}>
 ${hasCreds ? `<div class="cv-row-top"><span class="cv-badge ${on?'on':'off'}">${on?'On':'Off'}</span>
 <label class="cv-switch"><input type="checkbox" class="cv-optout" ${!enabled?'checked':''}> off</label></div>` : ""}
 ${statLine}
 <div class="cv-dup-hint" hidden aria-live="polite"></div>
 <div class="cv-fields">
 <input class="cv-user" type="text" autocomplete="off"${userVal} placeholder="${esc(ph||'Portal username / email')}">
 <input class="cv-pass" type="password" autocomplete="off" placeholder="${hasCreds?'saved, type to replace':'Portal password'}">
 <div class="cv-actions">
 <button class="btn btn-primary cv-save" type="button">${hasCreds?'Save':(addLabel||'Save')}</button>
 ${hasCreds ? `<button class="btn btn-ghost cv-clear" type="button">Remove</button>` : ""}
 </div>
 </div>
 </div>`;
 };

 // Group saved logins by base code (multi-login: a code can own several slots).
 const byCode = {};
 Object.keys(status).forEach(k => {
 const s = status[k]; if(!s || !s.hasCreds) return;
 const code = s.code || k;
 (byCode[code] = byCode[code] || []).push({ slot:k, username:s.username||"", enabled:s.enabled!==false, ok:s.ok, at:s.at, fails:s.fails, utility:s.utility });
 });

 const invCard = (v) => {
 const logins = (byCode[v.id]||[]).filter(l => !l.utility || CLOUD_INV_IDS.has(v.id));
 const saved = logins.map(l => credRow({ key:l.slot, saveCode:v.id, ph:"username / email", hasCreds:true, enabled:l.enabled, prefillUser:l.username, stat:{ok:l.ok,at:l.at,fails:l.fails} })).join("");
 const add = credRow({ key:v.id+"::__new__", saveCode:v.id, ph: logins.length?"another username / email":v.ph, hasCreds:false, addLabel: logins.length?"Add login":"Save" });
 return `<div class="cv-portal" data-code="${esc(v.id)}"><div class="cv-portal-name">${esc(v.label)}</div>${saved}${add}</div>`;
 };
 const utilCard = (code) => {
 const logins = byCode[code] || [];
 const name = cloudUtilLabel(code, catalog);
 const saved = logins.map(l => credRow({ key:l.slot, saveCode:code, ph:"username / email", hasCreds:true, enabled:l.enabled, prefillUser:l.username, stat:{ok:l.ok,at:l.at,fails:l.fails} })).join("");
 const add = credRow({ key:code+"::__new__", saveCode:code, ph: logins.length?"another username / email":"portal username / email", hasCreds:false, addLabel: logins.length?"Add login":"Save" });
 return `<div class="cv-portal" data-code="${esc(code)}"><div class="cv-portal-name">${esc(name)}</div>${saved}${add}</div>`;
 };

 // Defaults always visible: GMP + Eversource + CMP (newly live), then any
 // saved logins + anything just picked from the catalog.
 const shownCodes = [];
 const pushCode = (c) => { if(c && shownCodes.indexOf(c)===-1) shownCodes.push(c); };
 pushCode("gmp");
 pushCode("eversource");
 pushCode("cmp");
 Object.keys(byCode).filter(c => byCode[c].some(l=>l.utility)).sort().forEach(pushCode);
 (_cloudAddedUtils||[]).forEach(pushCode);

 listEl.innerHTML = `
 <div class="cv-group">
 <div class="cv-group-h">Inverter portals</div>
 <div class="cv-group-s">Live production, pulled server-side and kept under 5 minutes old. Add a login for each portal account; link several under one vendor.</div>
 ${CLOUD_INVERTERS.map(invCard).join("")}
 </div>
 <div class="cv-group">
 <div class="cv-group-h">Utility portals</div>
 <div class="cv-group-s">Utility bills, refreshed daily, powers automatic offtaker invoices and billing reports. Add a login for each utility you bill through.</div>
 ${shownCodes.map(utilCard).join("")}
 <div class="cv-addutil">
 <button type="button" class="cv-addutil-btn">+ Add a utility login</button>
 <div class="cv-picker" hidden>
 <input type="text" class="cv-picker-search" autocomplete="off" placeholder="Search your utility, GMP, a co-op, a city…">
 <div class="cv-picker-results"></div>
 </div>
 </div>
 </div>`;

 // Finish gate: enabled once at least one login is stored. Skip stays available.
 const savedCount = Object.keys(status).length;
 const fb = document.getElementById("cvFinishBtn");
 if(fb){ const ok = savedCount>0; fb.style.opacity = ok?"1":".5"; fb.style.pointerEvents = ok?"auto":"none"; fb.textContent = ok ? `Finish setup → (${savedCount} connected)` : "Finish setup →"; }
 // Once at least one login is stored, Finish is the action, retire the skip affordances.
 const skipBtn = document.getElementById("cvSkipBtn"); if(skipBtn) skipBtn.style.display = savedCount>0 ? "none" : "";
 const skipNote = document.getElementById("cvSkipNote"); if(skipNote) skipNote.style.display = savedCount>0 ? "none" : "";

 const consentOk = () => { const c = document.getElementById("cvConsentChk"); return !!(c && c.checked); };

 // ── wire each credential row ──
 // Backend upserts by (provider, username_lc), surface a live "already in vault"
 // indicator so "Add login" with a duplicate username is not a silent overwrite.
 const knownUsersByCode = {};
 Object.keys(status).forEach(k => {
 const s = status[k]; if(!s || !s.hasCreds) return;
 const code = s.code || k;
 const u = (s.username || "").trim(); if(!u) return;
 (knownUsersByCode[code] = knownUsersByCode[code] || []).push({ username:u, usernameLc:u.toLowerCase() });
 });
 listEl.querySelectorAll(".cv-row").forEach(row => {
 const key = row.dataset.key;
 const saveCode = row.dataset.savecode;
 const userEl = row.querySelector(".cv-user");
 const passEl = row.querySelector(".cv-pass");
 const saveBtn = row.querySelector(".cv-save");
 const clearBtn = row.querySelector(".cv-clear");
 const optEl = row.querySelector(".cv-optout");
 const dupHint = row.querySelector(".cv-dup-hint");
 const baseLabel = saveBtn.textContent;
 let savedLabel = baseLabel;
 const cloudHost = (catalog[saveCode] && catalog[saveCode].host) || "";
 const origUserLc = (row.dataset.origuser || "").trim().toLowerCase();
 const isAddRow = row.dataset.hascreds !== "1";
 const findDup = () => {
 const uLc = (userEl.value || "").trim().toLowerCase();
 if(!uLc) return null;
 const known = knownUsersByCode[saveCode] || [];
 return known.find(k => k.usernameLc === uLc && k.usernameLc !== origUserLc) || null;
 };
 const paintDup = () => {
 if(!dupHint) return false;
 const hit = findDup();
 if(hit){
 row.classList.add("cv-row-dup");
 userEl.classList.add("cv-user-dup");
 dupHint.hidden = false;
 dupHint.innerHTML = isAddRow
 ? `⚠ <b>Already in your vault</b>, <code>${esc(hit.username)}</code> is saved for this portal. Saving updates that login's password (doesn't add a second copy).`
 : `⚠ <b>Duplicate username</b>, <code>${esc(hit.username)}</code> is already saved for this portal. Saving updates that existing login instead.`;
 if(isAddRow){
 savedLabel = "Update existing";
 if(saveBtn.textContent === baseLabel || saveBtn.textContent === "Add login" || saveBtn.textContent === "Save"){
 saveBtn.textContent = savedLabel;
 }
 }
 return true;
 }
 row.classList.remove("cv-row-dup");
 userEl.classList.remove("cv-user-dup");
 dupHint.hidden = true;
 dupHint.textContent = "";
 if(isAddRow){
 savedLabel = baseLabel;
 if(saveBtn.textContent === "Update existing") saveBtn.textContent = baseLabel;
 }
 return false;
 };
 userEl.addEventListener("input", paintDup);
 userEl.addEventListener("blur", paintDup);
 paintDup();
 saveBtn.addEventListener("click", async () => {
 const u = (userEl.value||"").trim(), p = passEl.value||"";
 if(!u || !p){ saveBtn.textContent = "Enter both"; setTimeout(()=>saveBtn.textContent=savedLabel,1500); return; }
 if(!consentOk()){
 saveBtn.textContent = "Tick the box ↑";
 const c = document.getElementById("cvConsent");
 if(c){ c.classList.add("flash"); setTimeout(()=>c.classList.remove("flash"),1500); c.scrollIntoView({behavior:"smooth",block:"nearest"}); }
 setTimeout(()=>saveBtn.textContent=savedLabel,1800);
 return;
 }
 const isDup = !!findDup();
 paintDup();
 saveBtn.textContent = isDup ? "Updating…" : "Saving…";
 const r = await cloudApi("set", { provider:saveCode, username:u, password:p, login_host:cloudHost, consent:true });
 passEl.value = "";
 if(r.ok){
 saveBtn.textContent = isDup ? "✓ Updated" : "✓ Saved";
 // Inverter harvest can take 30–60s, dashboard shows Connecting… until arrays land
 const inv = { chint:1, fronius:1, sma:1, solaredge:1, locus:1, alsoenergy:1 };
 if(inv[saveCode]) markPendingVendor(saveCode, (CLOUD_INVERTERS.find(x=>x.id===saveCode)||{}).label || saveCode, "cloud harvest starting");
 setTimeout(()=>wireCloudVault(), 700);
 }
 else {
 const msg = (r.error==="http_403") ? "Not enabled yet"
 : (r.error && r.error.length && r.error.length < 60) ? r.error : "Couldn't save, try again";
 saveBtn.textContent = "✕ " + msg;
 setTimeout(()=>saveBtn.textContent=savedLabel, 4000);
 }
 });
 if(clearBtn) clearBtn.addEventListener("click", async () => { await cloudApi("clear", { provider:saveCode, username:(userEl.value||"").trim() }); wireCloudVault(); });
 if(optEl) optEl.addEventListener("change", async () => { await cloudApi("toggle", { provider:saveCode, username:(userEl.value||"").trim(), enable: !optEl.checked }); wireCloudVault(); });
 });

 // ── wire the searchable utility picker over the whole live catalog ──
 const addBtn = listEl.querySelector(".cv-addutil-btn");
 const picker = listEl.querySelector(".cv-picker");
 const searchEl = listEl.querySelector(".cv-picker-search");
 const resultsEl = listEl.querySelector(".cv-picker-results");
 if(addBtn && picker){ addBtn.addEventListener("click", () => { picker.hidden = !picker.hidden; if(!picker.hidden) setTimeout(()=>searchEl&&searchEl.focus(),30); }); }
 const codes = Object.keys(catalog);
 if(searchEl && resultsEl){
 const renderResults = () => {
 const q = (searchEl.value||"").trim().toLowerCase();
 if(!q){ resultsEl.innerHTML = `<div class="cv-picker-hint">Type your utility's name (e.g. “Green Mountain”, “Washington Electric”, a city, or a state).</div>`; return; }
 const hits = codes.filter(c => { const l=(catalog[c].label||"").toLowerCase(); return l.includes(q) || c.includes(q) || (catalog[c].state||"").toLowerCase()===q; }).slice(0,25);
 if(!hits.length){ resultsEl.innerHTML = `<div class="cv-picker-hint">No match. Not seeing your utility? It may need to be added, tell us and we'll wire it up.</div>`; return; }
 resultsEl.innerHTML = hits.map(c => `<button type="button" class="cv-picker-item" data-code="${esc(c)}">${esc(catalog[c].label)}${catalog[c].state?` <span class="cv-picker-state">${esc(catalog[c].state)}</span>`:""}</button>`).join("");
 resultsEl.querySelectorAll(".cv-picker-item").forEach(it => it.addEventListener("click", () => {
 if(_cloudAddedUtils.indexOf(it.dataset.code)===-1) _cloudAddedUtils.push(it.dataset.code);
 wireCloudVault().then(() => {
 const card = listEl.querySelector(`.cv-portal[data-code="${CSS.escape(it.dataset.code)}"]`);
 if(card){ card.scrollIntoView({behavior:"smooth",block:"center"}); const u = card.querySelector(".cv-row:last-child .cv-user"); if(u) u.focus(); }
 });
 }));
 };
 searchEl.addEventListener("input", renderResults);
 renderResults();
 }
}

function selectVendor(code){
 const v = vendorByCode(code);
 if(!v.available) return;
 state.gmpPath = false;
 state.vendor = code;
 render(); syncConnect();
}

function setField(name, val){
 if(state.vendor==="solaredge" && name==="apiKey"){ state.apiKey = val.trim(); }
 else { state.fields[name] = val; }
 syncConnect();
}

function syncConnect(){
 const v = vendorByCode(state.vendor);
 const b = document.getElementById("discoverBtn");
 if(!b) return;
 // Connect-first: no name/email/password here, we collect the email AFTER the
 // owner sees their arrays. The discover button only needs valid credentials.
 if(!v.available){ b.disabled = true; return; }
 let credsOk;
 if(v.discover){ credsOk = state.apiKey.length>3; }
 else {
 // every non-optional field filled (labels with "optional" are skippable)
 credsOk = (v.fields||[]).every(f=>/optional/i.test(f.label) || (state.fields[f.name]||"").trim().length>0);
 }
 b.disabled = !credsOk;
}

// Vendor-aware pre-signup preview. EVERY available vendor now hits the public
// /preview endpoint so the owner sees their REAL site(s) + value before signup:
// - SolarEdge / Locus(+partner) → list the whole account/partner
// - Locus(no partner) / Fronius / SMA → preview the one named system
// Falls back to the demo cascade only when the backend is unreachable.
async function connectVendor(){
 state.userConnect = true;
 const v = vendorByCode(state.vendor);
 const scan = document.getElementById("scanArea");
 const btn = document.getElementById("discoverBtn");
 btn.disabled = true;
 const verb = v.discover ? `Reaching your ${v.label} account…` : `Checking your ${v.label} system…`;
 scan.innerHTML = `<div class="scan"><span class="ring"></span> ${verb}</div>`;

 // Build the per-vendor config from the fields the connect form collected.
 const config = {};
 (v.fields||[]).forEach(f=>{
 const val = (f.name==="apiKey") ? state.apiKey : (state.fields[f.name]||"");
 if(val) config[f.name==="apiKey" ? "api_key" : f.name] = val.trim();
 });

 let sites = [];
 state.realSites = false;
 state.totals = null;
 try{
 const res = await fetch(`${API_BASE}/v1/array-owners/public/preview`,{
 method:"POST", headers:{"Content-Type":"application/json"},
 body: JSON.stringify({ vendor: state.vendor, config })
 });
 const data = await res.json().catch(()=>({}));
 if(res.status===429){
 scan.innerHTML = `<div class="helper" style="color:var(--warn)">${data.detail||"Too many attempts, give it a minute and try again."}</div>`;
 btn.disabled=false; return;
 }
 if(res.ok && data.ok && Array.isArray(data.sites) && data.sites.length){
 // Their actual array(s), the sublime moment.
 sites = data.sites.map(s=>({...s, vendor: v.label}));
 state.realSites = true;
 state.totals = data.totals || null;
 } else if(res.ok && data.ok===false && data.message){
 // Friendly, actionable rejection (bad creds, scope, empty account).
 scan.innerHTML = `<div class="helper" style="color:var(--warn)">${data.message}</div>`;
 btn.disabled=false; return;
 } else {
 // Unexpected/empty response from a reachable backend, DON'T fabricate a
 // fleet. Show an honest "couldn't read anything back" state and let them
 // retry; the account is never created from invented arrays.
 showConnectError(v);
 return;
 }
 }catch(e){
 // CORS/network/offline, be honest. We used to fall back to 7 fabricated demo
 // arrays here, which showed a fake fleet and then created an EMPTY account
 // (credential-attach is gated on realSites). Never present sample arrays as if
 // they were the owner's, show a clear error and let them try again.
 showConnectError(v);
 return;
 }
 state.sites = sites;
 go(2);
}

// Honest failure state on the Connect step: no fabricated arrays, no advancing to
// "Your arrays". Keep the discover button live so the owner can retry.
function showConnectError(v){
 state.realSites = false;
 state.sites = [];
 state.totals = null;
 const scan = document.getElementById("scanArea");
 const btn = document.getElementById("discoverBtn");
 if(btn) btn.disabled = false;
 if(scan){
 const who = (v && v.label) ? `your ${v.label} portal` : "your inverter portal";
 scan.innerHTML = `<div class="helper" style="color:var(--warn)">We couldn't reach ${who} just now, nothing was saved. Check your connection and credentials, then try again.</div>`;
 }
}

// Animate a dollar figure from 0 → target over `ms` (eased), tabular $.
function countUp(el, target, ms){
 if(!el) return;
 const start = performance.now();
 const fmt = n => "$"+Math.round(n).toLocaleString();
 function tick(now){
 const t = Math.min((now-start)/ms, 1);
 const eased = 1 - Math.pow(1-t, 3);
 el.textContent = fmt(target*eased);
 if(t<1) requestAnimationFrame(tick);
 else el.textContent = fmt(target);
 }
 requestAnimationFrame(tick);
}

function markPendingVendor(code, label, note){
