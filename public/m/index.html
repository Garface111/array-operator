<!doctype html>
<html lang="en">
  <head>
    <!-- Boot-failure fallback (Ford, 2026-07-24) — replaces the 07-23 bounce that
         sent every browser back to the desktop SPA. If the SPA has painted
         nothing into #root a few seconds in (bad bundle, boot crash), fall back
         to the desktop site instead of stranding the owner on a white screen. A
         healthy boot paints immediately and this never fires. ?desktop=1 stops
         the desktop page bouncing straight back, so there is no redirect loop.
         Keep in sync with public/m/index.html after vite builds. -->
    <script>
    (function () {
      try {
        if (window.Capacitor) return;   // native shell: no desktop site to fall back to
        var done = false;
        function bail(why) {
          if (done) return;
          done = true;
          try { sessionStorage.setItem("ao_m_boot_fail", why || "1"); } catch (e) {}
          location.replace("/?desktop=1");
        }
        // Primary signal: the app bundle itself failing to load (404 after a bad
        // deploy, dropped connection). Capture phase, because resource errors do
        // not bubble. This is the real "/m is broken" case and it bails at once.
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (!t || t === window) return;
          var src = t.src || t.href || "";
          if ((t.tagName === "SCRIPT" || t.tagName === "LINK") && /\/m\/assets\//.test(src)) {
            bail("asset-error");
          }
        }, true);

        // Backstop only, deliberately generous. A blocked/slow webfont stylesheet
        // defers the module script, so #root can still be empty several seconds
        // in on a bad connection while the app is perfectly healthy — bailing at
        // ~8s would strand those owners on desktop for no reason. Armed at parse
        // time, not on DOMContentLoaded: a failed module leaves the document at
        // readyState "interactive" and DCL never fires.
        setTimeout(function () {
          var r = document.getElementById("root");
          if (!r || r.childElementCount === 0) bail("empty-root");
        }, 20000);
      } catch (e) {}
    })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <script>
    // FORM FACTOR: /m is the PHONE app. A tablet-sized viewport -- an unfolded
    // foldable, an iPad -- belongs on the desktop site, which is better at that
    // width. A foldable does not reload when it opens, so this re-checks on
    // resize, not just at boot.
    //
    // MUST stay below the viewport meta above. Before that meta is parsed a
    // phone reports its default ~980px layout viewport, which reads as a tablet
    // and bounces to "/", which bounces straight back here. That was a real
    // reload loop on 2026-07-24.
    //
    // Hands back to "/" and deliberately NOT "/?desktop=1": that flag is
    // permanent, so folding the phone shut would never return here.
    (function () {
      try {
        if (window.Capacitor) return;   // native shell: nowhere to hand back to
        // Only an explicit ?mobile=1 in THIS url pins us here. The persisted
        // ao_force_mobile flag is sticky forever and would strand an unfolded
        // foldable in the phone app -- the bug this guard exists for.
        if (/[?&]mobile=1(?:&|$)/.test(location.search || "")) return;

        // Loop breaker: however wrong a measurement gets, never leave the owner
        // on a page that reloads forever. Three hand-offs and we stay put.
        var HOPS = "ao_ff_hops";
        function hops() {
          try { return parseInt(sessionStorage.getItem(HOPS) || "0", 10) || 0; }
          catch (e) { return 0; }
        }
        if (hops() >= 3) return;

        var gone = false;
        function isPhone() {
          var w = window.innerWidth, h = window.innerHeight;
          return w <= 600 || (h <= 500 && w <= 900);
        }
        function check() {
          if (gone) return;
          if (isPhone()) {
            // Landed somewhere stable, so whatever hand-offs got us here were
            // not a loop. Clear the budget or a few honest fold/unfold cycles
            // would exhaust it and disable the guard for the rest of the session.
            try { sessionStorage.removeItem(HOPS); } catch (e) {}
            return;
          }
          gone = true;
          try { sessionStorage.setItem(HOPS, String(hops() + 1)); } catch (e) {}
          location.replace("/" + (location.hash || ""));
        }
        check();
        var t = null;
        window.addEventListener("resize", function () {
          clearTimeout(t);
          t = setTimeout(check, 250);
        });
      } catch (e) {}
    })();
    </script>
