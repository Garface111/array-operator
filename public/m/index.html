<!doctype html>
<html lang="en">
  <head>
    <!-- Boot-failure fallback (Ford, 2026-07-24) — replaces the 07-23 bounce that
         sent every browser back to the desktop SPA. Instead of assuming /m is
         broken, prove it at runtime: if the SPA has painted nothing into #root a
         few seconds in (bad bundle, boot crash), fall back to the desktop site
         rather than stranding the owner on a white screen. A healthy boot paints
         immediately and this never fires. ?desktop=1 stops the desktop page from
         bouncing straight back here, so there is no redirect loop.
         Keep in sync with apps/owner-web/index.html. -->
    <script>
    (function () {
      try {
        if (window.Capacitor) return;   // native shell: no desktop site to fall back to
        var done = false;
        function bail(why) {
          if (done) return;
          done = true;
          try { sessionStorage.setItem("ao_m_boot_fail", why || "1"); } catch (e) {}
          location.replace("/?desktop=1");
        }
        // FORM FACTOR: /m is the PHONE app. A tablet-sized viewport -- an
        // unfolded foldable, an iPad -- belongs on the desktop site, which is
        // the better product at that width. A Fold does not reload when it
        // opens, so this is re-checked on resize, not just at boot.
        //
        // Hands back to "/" and deliberately NOT "/?desktop=1": that flag is
        // permanent, so folding the phone shut would never return here.
        // Only an explicit ?mobile=1 in THIS url pins us here. The persisted
        // ao_force_mobile flag is sticky forever and would strand an unfolded
        // foldable in the phone app, which is the bug this guard exists for.
        var mForced = /[?&]mobile=1(?:&|$)/.test(location.search || "");
        function mIsPhone() {
          var w = window.innerWidth, h = window.innerHeight;
          return w <= 600 || (h <= 500 && w <= 900);
        }
        function mCheckFormFactor() {
          if (mForced || done) return;
          if (mIsPhone()) return;
          done = true;
          location.replace("/" + (location.hash || ""));
        }
        mCheckFormFactor();
        var mT = null;
        window.addEventListener("resize", function () {
          clearTimeout(mT);
          mT = setTimeout(mCheckFormFactor, 250);
        });

        // Primary signal: the app bundle itself failing to load (404 after a bad
        // deploy, dropped connection). Capture phase, because resource errors do
        // not bubble. This is the real "/m is broken" case and it bails at once.
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (!t || t === window) return;
          var src = t.src || t.href || "";
          if ((t.tagName === "SCRIPT" || t.tagName === "LINK") && /\/m\/assets\//.test(src)) {
            bail("asset-error");
          }
        }, true);

        // Backstop only, deliberately generous. A blocked/slow webfont stylesheet
        // defers the module script, so #root can still be empty several seconds
        // in on a bad connection while the app is perfectly healthy — bailing at
        // ~8s would strand those owners on desktop for no reason. Armed at parse
        // time, not on DOMContentLoaded: a failed module leaves the document at
        // readyState "interactive" and DCL never fires.
        setTimeout(function () {
          var r = document.getElementById("root");
          if (!r || r.childElementCount === 0) bail("empty-root");
        }, 20000);
      } catch (e) {}
    })();
    </script>
