<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Array Operator</title>
  <style>
    #fsBtn {
      position: relative;
    }
    #fsBtn[data-sent]:hover::after {
      content: "We read every one.";
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <button id="fsBtn">Suggest a feature</button>
  <script>
    const btn = document.getElementById('fsBtn');
    // simulate post-send state
    btn.addEventListener('click', () => {
      setTimeout(() => btn.setAttribute('data-sent', 'true'), 100);
    });
  </script>
</body>
</html>
